<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Травоведение</title>
<meta name="theme-color" content="#F5EEDF">
<link href="../assets/fonts/manrope.css" rel="stylesheet">
<style>
:root{--c:#284F36;--green:#284F36;--orange:#D85B21;--navy:#1F3954;--sand:#E4D5C2;--cream:#F5EEDF;--paper:#FBF8F1;
  --ink:var(--navy);--muted:#5B6B7C;--bg:var(--cream);--card:var(--paper);--line:var(--sand);--ok:var(--green);--bad:var(--orange);--half:#B9862F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iPhone: кнопки без системного оформления, без задержки и двойного «зума» по быстрому касанию */
button{-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
select,input,textarea,a,label{touch-action:manipulation}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:Gilroy,Manrope,system-ui,sans-serif;font-weight:400;color:var(--ink)}
b,strong,h1,h2,h3{font-weight:800}
button,input,select,textarea{font-family:inherit}
#app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;overflow-x:clip}
.blob{position:absolute;pointer-events:none;z-index:0}
.hero{color:var(--ink);padding:56px 20px 10px;position:relative}
.hero h1{margin:6px 0 0;font-size:30px;font-weight:800;line-height:1.12;letter-spacing:-.3px;position:relative;z-index:1;max-width:80%}
.hero .kick{font-size:13px;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:1.5px;position:relative;z-index:1}
.cover{width:100%;max-height:220px;object-fit:cover;border-radius:24px;margin:16px 0 0;display:block;position:relative;z-index:1}
.wrap{padding:16px;flex:1;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.card{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 10px 30px rgba(31,57,84,.10)}
.desc{white-space:pre-wrap;line-height:1.5;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sand);border-radius:99px;padding:8px 13px;font-weight:800;font-size:13px}
label.lbl{font-weight:800;font-size:13px;color:var(--muted);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.inp{width:100%;font-size:18px;padding:15px 16px;border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--c)}
.btn{border:0;border-radius:20px;padding:18px 20px;font-size:18px;font-weight:800;cursor:pointer;background:var(--c);color:var(--cream);box-shadow:0 8px 20px rgba(40,79,54,.25);width:100%;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.red{background:var(--bad)}
.msg{text-align:center;padding:40px 20px;font-weight:800;font-size:17px;line-height:1.5}
.msg .big{font-size:56px}
.err{color:var(--bad);font-weight:800;font-size:14px;min-height:18px;margin-top:6px}
/* вопрос */
.topbar{display:flex;align-items:center;gap:10px;padding:16px 16px 6px;position:sticky;top:0;background:var(--bg);z-index:5}
.count{font-weight:800;font-size:13px;color:var(--c);white-space:nowrap;text-transform:uppercase;letter-spacing:1.5px;flex:1}
.progress{display:flex;gap:5px;padding:0 16px 4px}
.progress i{flex:1;height:6px;border-radius:6px;background:var(--sand);transition:background .3s}
.progress i.done{background:var(--c)}.progress i.now{background:var(--orange)}
.progress.long i{height:6px;border-radius:0}.progress.long{gap:0}.progress.long i:first-child{border-radius:6px 0 0 6px}.progress.long i:last-child{border-radius:0 6px 6px 0}
.timer{font-weight:800;font-size:15px;background:var(--paper);border-radius:14px;padding:8px 12px;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(31,57,84,.08)}
.timer.low{background:var(--orange);color:var(--paper)}
.snd{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.snd.on{background:var(--ink);color:var(--cream)}
.dots{display:flex;flex-wrap:wrap;gap:6px;padding:6px 16px 0}
.dots button{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:12px;color:var(--muted);cursor:pointer}
.dots button.ans{background:var(--c);border-color:var(--c);color:var(--cream)}
.dots button.cur{border-color:var(--ink);color:var(--ink)}
.dots button.ans.cur{border-color:var(--orange);color:var(--cream)}
.qtext{font-size:24px;font-weight:800;line-height:1.2;white-space:pre-wrap}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.qtimer{display:flex;align-items:center;gap:10px;margin-top:16px}
.qtimer .bar{flex:1;height:8px;border-radius:8px;background:var(--sand);overflow:hidden}
.qtimer .bar i{display:block;height:100%;width:100%;background:var(--green);border-radius:8px;transform-origin:left center;animation:qBar linear forwards;transition:background .3s}
@keyframes qBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.qtimer b{font-size:15px;min-width:40px;text-align:right;font-variant-numeric:tabular-nums;color:var(--green)}
.qtimer.low .bar i{background:var(--orange)}.qtimer.low b{color:var(--orange)}
.qimg{display:block;width:100%;height:auto;border-radius:18px;margin-top:14px;max-height:340px;object-fit:contain;background:var(--cream)}
/* небольшие iPhone: картинка и текст компактнее, чтобы варианты ответа были видны без прокрутки */
@media(max-height:760px){.qimg{max-height:30vh}.qtext{font-size:20px}.card{padding:16px}.opt{min-height:54px;padding:9px 14px;font-size:16px}.topbar{padding-top:10px}.hero{padding-top:40px}}
.imgfail{display:flex;align-items:center;justify-content:center;gap:8px;min-height:120px;border-radius:18px;margin-top:14px;background:var(--cream);color:var(--muted);font-weight:800;font-size:14px;border:2px dashed var(--line);cursor:pointer;width:100%;text-align:center;padding:12px}
.media{margin-top:14px}
.media iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px}
.media a{display:inline-flex;gap:6px;align-items:center;font-weight:800;color:var(--ink);text-decoration:none;background:var(--sand);padding:11px 15px;border-radius:14px}
.hint{font-size:13px;font-weight:800;color:var(--muted);margin-top:2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:11px 16px;min-height:62px;font-size:17px;text-align:left;cursor:pointer;color:var(--ink);width:100%;transition:background .2s,color .2s,border-color .2s}
.opt .mark{width:36px;height:36px;border-radius:50%;background:var(--sand);color:var(--ink);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;transition:background .2s,color .2s}
.opt.sq .mark{border-radius:12px}
@media(hover:hover){.opt:not([disabled]):hover{border-color:var(--c)}}
.opt.on{background:var(--c);border-color:var(--c);color:var(--cream)}
.opt.on .mark{background:var(--cream);color:var(--c)}
.opt.img{flex-direction:column;align-items:stretch;padding:8px}
.opt.img img{display:block;width:100%;height:auto;max-height:240px;object-fit:cover;border-radius:14px;pointer-events:none}
.opt .mark,.opt span{pointer-events:none}
.opt.img .row{display:flex;align-items:center;gap:10px;padding:2px 4px}
.opt[disabled]{opacity:.6;cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-size:19px;font-weight:800;padding:24px 10px}
.ord{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:10px 10px 10px 14px;font-size:17px}
.ord .n{width:32px;height:32px;border-radius:50%;background:var(--sand);color:var(--ink);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.ord .t{flex:1}
.ord button{width:42px;height:42px;border-radius:14px;border:0;background:var(--cream);color:var(--ink);font-size:18px;font-weight:800;cursor:pointer}
.ord button[disabled]{opacity:.3}
.ord.moved{animation:qPick .3s ease}
.pair{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s}
.pair b{font-size:17px}
.pair select{font-size:16px;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.pair.done{border-color:var(--c)}
textarea.inp{min-height:130px;resize:vertical;font-size:17px}
.nav{display:flex;gap:10px;padding:14px 16px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:linear-gradient(rgba(245,238,223,0),var(--bg) 30%);z-index:4;pointer-events:none}
.nav .btn{pointer-events:auto}   /* прозрачный край панели не перехватывает касания по вариантам ответа */
.nav .btn{flex:1}
.locked{font-size:13px;font-weight:800;color:var(--bad);text-align:center}
.preview{background:var(--orange);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:8px;position:relative;z-index:6}
/* анимации */
@keyframes qUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes qIn{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes qInBack{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
@keyframes qOut{to{opacity:0;transform:translateX(-48px)}}
@keyframes qOutBack{to{opacity:0;transform:translateX(48px)}}
@keyframes qPick{0%{transform:scale(1)}40%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes qPop{0%{opacity:0;transform:scale(.85)}70%{opacity:1;transform:scale(1.04)}100%{transform:none}}
.anim .card{animation:qIn .42s cubic-bezier(.2,.8,.2,1) both}
.anim.back .card{animation-name:qInBack}
.in{animation:qUp .45s cubic-bezier(.2,.8,.2,1) both}
.leave{animation:qOut .24s ease-in forwards}
.leave.back{animation-name:qOutBack}
.opt.picked{animation:qPick .25s ease}
.pop{animation:qPop .6s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ответ сразу */
.opt.right{background:var(--green);border-color:var(--green);color:var(--cream);opacity:1}
.opt.right .mark{background:var(--cream);color:var(--green)}
.opt.wrong{background:var(--orange);border-color:var(--orange);color:#fff;opacity:1;animation:qShake .4s ease}
.opt.wrong .mark{background:#fff;color:var(--orange)}
.opt.dim{opacity:.45}
.fb{border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:0 10px 30px rgba(31,57,84,.12);animation:qFb .5s cubic-bezier(.2,.9,.25,1.1) both}
.fb-bar{display:flex;align-items:center;gap:14px;padding:16px 18px;color:#fff;background:var(--green)}
.fb.bad .fb-bar,.fb.time .fb-bar{background:var(--orange)}
.fb.half .fb-bar{background:var(--half)}
.fb.open .fb-bar{background:var(--navy)}
.fb-bar b{display:block;font-size:22px}
.fb-joke{display:block;font-size:15px;opacity:.95;margin-top:2px}
.fb-ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex:none;animation:qPop .5s .15s both}
.fb-right{padding:14px 18px 0;font-size:16px}
.fb-e{padding:12px 18px 18px;font-size:15px;line-height:1.5;color:var(--ink)}
.fb-ph{position:relative;margin:14px 18px 0;border-radius:18px;overflow:hidden;background:var(--cream);aspect-ratio:4/3;max-height:320px;animation:qPh .7s .15s cubic-bezier(.2,.8,.2,1) both}
.fb-ph img{display:block;width:100%;height:100%;object-fit:cover;animation:qPhZoom 6s .15s ease-out both}
.fb-ph figcaption{position:absolute;left:12px;bottom:12px;background:rgba(251,248,241,.94);color:#284F36;font-weight:800;font-size:15px;padding:7px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(31,57,84,.18);animation:qPop .5s .55s both}
.fb-ph{margin-left:auto;margin-right:auto;width:calc(100% - 36px)}
@keyframes qPh{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes qPhZoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.fb-right+.fb-e,.fb-bar+.fb-e{padding-top:14px}
.fb-bar:last-child{border-radius:0}
@keyframes qFb{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes qShake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
/* напряжённый режим */
body.tense{background:#EFE4D0}
body.tense .topbar{background:#EFE4D0}
body.tense .nav{background:linear-gradient(rgba(239,228,208,0),#EFE4D0 30%)}
body.tense .qtimer .bar{height:12px}
body.tense .qtimer b{font-size:20px}
body.tense::after{content:'';position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:30;box-shadow:inset 0 0 90px 24px rgba(216,91,33,.55);opacity:0;transition:opacity .3s;will-change:opacity}
body.tense.danger::after{animation:qPulse 1s ease-in-out infinite}
body.tense.danger .qtimer{animation:qShake .5s ease infinite}
body.tense.danger .card{box-shadow:0 0 0 3px var(--orange),0 10px 30px rgba(216,91,33,.25)}
/* пульсирует только прозрачность готовой тени — iPhone не перерисовывает весь экран 60 раз в секунду */
@keyframes qPulse{0%,100%{opacity:.35}50%{opacity:1}}
/* итог */
.ring{width:170px;height:170px;margin:4px auto 0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .arc{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .v{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:42px;font-weight:800}
.ring .v span{font-size:13px;font-weight:800;color:var(--muted)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.res-grid div{background:var(--cream);border-radius:18px;padding:12px 4px}
.res-grid b{display:block;font-size:21px;font-weight:800}
.res-grid span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.rv{border-left:5px solid var(--line);padding:4px 0 4px 12px;margin:14px 0}
.rv.ok{border-color:var(--ok)}.rv.bad{border-color:var(--bad)}.rv.half{border-color:var(--half)}
.rv .t{font-weight:800}
.rv .y,.rv .c{font-size:15px;margin-top:4px}
.rv .c{color:var(--ok);font-weight:800}
.rv .e{font-size:14px;color:var(--muted);margin-top:6px;background:var(--cream);border-radius:14px;padding:9px 11px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));pointer-events:none;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:16px;font-weight:800;z-index:50;max-width:90%;text-align:center}
.modal-bg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(31,57,84,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal{background:var(--paper);border-radius:28px;padding:22px;max-width:380px;width:100%;text-align:center;animation:qPop .35s ease both}
.modal h3{margin:0 0 8px}
.modal .row{display:flex;gap:10px;margin-top:16px}
</style>
</head>

   Safari на iPhone иногда «съедает» click, если в этот момент на странице что-то меняется (идёт таймер).

  var a = S.att, n = a.questions.length, q = cur();
  var dots = S.meta.allowBack ? '<div class="dots">' + a.questions.map(function (x, i) {
    return '<button class="' + (hasAnswer(x) ? 'ans' : '') + (i === S.i ? ' cur' : '') + '" onclick="go(' + i + ')" aria-label="Вопрос ' + (i + 1) + '">' + (i + 1) + '</button>'; }).join('') + '</div>' : '';
  var last = S.i === n - 1, segs = '';
  for (var k = 0; k < n; k++) segs += '<i class="' + (k < S.i ? 'done' : k === S.i ? 'now' : '') + '"></i>';
  var snd = hasTimers() ? '<button id="snd" class="snd' + (S.sound ? ' on' : '') + '" onclick="toggleSound()" aria-label="' + (S.sound ? 'Выключить' : 'Включить') + ' звук таймера">' + (S.sound ? ICON_SND : ICON_MUTE) + '</button>' : '';
  return '<div class="topbar"><div class="count">Вопрос ' + (S.i + 1) + ' из ' + n + '</div>' +
      (a.deadline ? '<div class="timer" id="ttotal">⏱</div>' : '') + snd + '</div>' +
    '<div class="progress' + (n > 20 ? ' long' : '') + '">' + segs + '</div>' + dots +
    '<div class="wrap ' + S.anim + '" id="qwrap">' + renderQ(true) + '</div>' +
    '<div class="nav">' + (S.meta.allowBack && S.i > 0 ? '<button class="btn ghost" onclick="prev()">Назад</button>' : '') +
      '<button class="btn" onclick="next()">' + (S.meta.instantFeedback && !S.fb[q.id] && !S.timedOut[q.id] ? 'Ответить' : last ? 'Завершить' : S.meta.instantFeedback ? 'Дальше' : 'Далее') + '</button></div>';
}
function renderQ(returnHtml) {
  var q = cur(), a = S.answers[q.id], lock = isLocked(q), h = '', k0 = 0, fb = S.fb[q.id];
  var animOn = returnHtml === true && !!S.anim;
  function inn() { if (!animOn) return ''; var d = 140 + (k0++) * 80; return ' in" style="animation-delay:' + d + 'ms'; }
  h += '<div class="card"><div class="qmeta"><span>' + q.points + ' ' + word(q.points, 'балл', 'балла', 'баллов') + '</span>' +
    (q.type === 'multi' ? '<span>· несколько ответов</span>' : '') + '</div>' +
    '<div class="qtext">' + esc(q.text) + '</div>' + (q.image ? '<img class="qimg" src="' + esc(q.image) + '" alt="" decoding="async" onerror="imgFail(this)">' : '') + mediaHtml(q.media) +
    (q.timeLimit && !lock ? qtimerHtml(q) : '') + '</div>';
  if (lock && !fb && !S.meta.instantFeedback) h += '<div class="locked">' + (S.timedOut[q.id] ? 'Время на этот вопрос вышло' : 'Ответ уже отправлен') + '</div>';
  var dis = lock ? ' disabled' : '';
  if (q.type === 'single' || q.type === 'multi') {
    var imgs = q.options.some(function (o) { return o.image; });
    h += (q.type === 'multi' ? '<div class="hint">Отметьте все верные варианты</div>' : '') + '<div class="opts' + (imgs ? ' grid' : '') + '">' + q.options.map(function (o, k) {
      var on = q.type === 'single' ? a === o.id : (a || []).indexOf(o.id) >= 0, letter = k < 26 ? String.fromCharCode(65 + k) : k + 1;
      var mk = fb && fb.correctIds ? (fb.correctIds.indexOf(o.id) >= 0 ? ' right' : on ? ' wrong' : ' dim') : '';
      var mark = '<span class="mark">' + (on && q.type === 'multi' ? '✓' : letter) + '</span>';
      return '<button class="opt' + (q.type === 'multi' ? ' sq' : '') + (on ? ' on' : '') + mk + (o.image ? ' img' : '') + (S.picked === o.id ? ' picked' : '') + inn() + '"' + dis + ' onclick="pick(\'' + o.id + '\')">' +
        (o.image ? '<img src="' + esc(o.image) + '" alt="" decoding="async" onerror="imgFail(this)"><span class="row">' + mark + esc(o.text) + '</span>' : mark + '<span>' + esc(o.text) + '</span>') + '</button>';
    }).join('') + '</div>';
  } else if (q.type === 'truefalse') {
    h += '<div class="tf">' + [[true, 'Верно'], [false, 'Неверно']].map(function (x) {
      var mk = fb && fb.correctIds ? (fb.correctIds.indexOf(x[0]) >= 0 ? ' right' : a === x[0] ? ' wrong' : ' dim') : '';
      return '<button class="opt' + (a === x[0] ? ' on' : '') + mk + (S.picked === x[0] ? ' picked' : '') + inn() + '"' + dis + ' onclick="S.picked=' + x[0] + ';setAns(' + x[0] + ')">' + x[1] + '</button>'; }).join('') + '</div>';
  } else if (q.type === 'text') {
    h += '<input class="inp' + inn() + '" id="ans" placeholder="Ваш ответ"' + dis + ' value="' + esc(a || '') + '" oninput="typed(this.value)" onkeydown="if(event.key===\'Enter\')next()">';
  } else if (q.type === 'open') {
    h += '<textarea class="inp' + inn() + '" id="ans" placeholder="Напишите ответ"' + dis + ' oninput="typed(this.value)">' + esc(a || '') + '</textarea>';
  } else if (q.type === 'order') {
    var ids = a || q.options.map(function (o) { return o.id; }), by = {};
    q.options.forEach(function (o) { by[o.id] = o; });
    h += '<div class="hint">Расставьте по порядку стрелками ↑↓</div><div class="opts">' + ids.map(function (id, k) {
      return '<div class="ord' + (S.moved === id ? ' moved' : '') + inn() + '"><span class="n">' + (k + 1) + '</span><span class="t">' + esc(by[id].text) + '</span>' +
        '<button aria-label="Выше"' + (k === 0 || lock ? ' disabled' : '') + ' onclick="moveItem(' + k + ',-1)">↑</button><button aria-label="Ниже"' + (k === ids.length - 1 || lock ? ' disabled' : '') + ' onclick="moveItem(' + k + ',1)">↓</button></div>';
    }).join('') + '</div>';
  } else if (q.type === 'match') {
    var m = a || {};
    h += '<div class="hint">Для каждого пункта выберите пару</div><div class="opts">' + q.left.map(function (l) {
      return '<div class="pair' + (m[l.id] ? ' done' : '') + inn() + '"><b>' + esc(l.text) + '</b><select' + dis + ' onchange="matchSet(\'' + l.id + '\',this.value)"><option value="">— выберите —</option>' +
        q.right.map(function (r) { return '<option value="' + r.id + '"' + (m[l.id] === r.id ? ' selected' : '') + '>' + esc(r.text) + '</option>'; }).join('') + '</select></div>';
    }).join('') + '</div>';
  }
  if (fb) {
    var head = {ok: 'Правильно!', bad: 'Неправильно', half: 'Почти!', time: 'Время вышло', open: 'Ответ принят'}[fb.kind];
    var icon = {ok: '✓', bad: '✕', half: '½', time: '⏳', open: '✓'}[fb.kind];
    h += '<div class="fb ' + fb.kind + '" id="fb"><div class="fb-bar"><span class="fb-ic">' + icon + '</span><div><b>' + head + '</b>' +
      (fb.joke ? '<span class="fb-joke">' + esc(fb.joke) + '</span>' : '') + '</div></div>' +
      (fb.kind !== 'ok' && fb.kind !== 'open' && fb.correct ? '<div class="fb-right">Правильный ответ: <b>' + esc(fb.correct) + '</b></div>' : '') +
      (fb.photo ? '<figure class="fb-ph"><img src="' + esc(fb.photo) + '" alt="' + esc(fb.correct || '') + '" onerror="this.parentNode.remove()"><figcaption>' + esc(fb.correct || '') + '</figcaption></figure>' : '') +
      (fb.explanation ? '<div class="fb-e">' + esc(fb.explanation) + '</div>' : '') + '</div>';
  }
  if (returnHtml === true) return h;
  var w = document.getElementById('qwrap'); if (w) { w.classList.remove('anim', 'back'); w.innerHTML = h; markDots(); tick(); }
}
function qtimerHtml(q) {
  var gone = ((S.used[q.id] || 0) + Date.now() - S.qStart) / 1000, left = Math.max(0, q.timeLimit - gone);
  return '<div class="qtimer' + (left <= 5 ? ' low' : '') + '" id="qtimer"><span class="bar"><i style="animation-duration:' + q.timeLimit + 's;animation-delay:-' + gone.toFixed(2) + 's"></i></span><b>' +
    (left >= 60 ? mmss(left) : Math.ceil(left)) + '</b></div>';
}
function markDots() {
  var bs = document.querySelectorAll('.dots button');
  S.att.questions.forEach(function (x, i) { if (bs[i]) bs[i].classList.toggle('ans', hasAnswer(x)); });
}
function renderResult() {
  var r = S.result, p = r.percent || 0, R = 72, C = 2 * Math.PI * R;
  var col = p >= 80 ? '#284F36' : p >= 50 ? '#B9862F' : '#D85B21';
  var emoji = p >= 90 ? '🏆' : p >= 70 ? '🎉' : p >= 50 ? '👍' : '💪';
  var review = (r.review || []).map(function (x, i) {
    var cls = x.ok === null ? '' : x.ok === 1 ? 'ok' : x.ok === 0.5 ? 'half' : 'bad';
    return '<div class="rv ' + cls + '"><div class="t">' + (i + 1) + '. ' + esc(x.text) + '</div>' +
      '<div class="y">Ваш ответ: ' + esc(x.yours) + (x.ok === 1 ? ' ✅' : x.ok === 0.5 ? ' 🟡 частично' : x.ok === 0 ? ' ❌' : '') + '</div>' +
      (x.ok !== 1 && x.correct ? '<div class="c">Правильно: ' + esc(x.correct) + '</div>' : '') +
      (x.explanation ? '<div class="e">💡 ' + esc(x.explanation) + '</div>' : '') + '</div>';
  }).join('');
  return '<div class="hero"><div class="kick">' + esc(r.title) + '</div><h1>' + emoji + ' Готово, ' + esc(r.name) + '!</h1></div><div class="wrap">' +
    '<div class="card pop"><div class="ring"><svg width="170" height="170"><circle cx="85" cy="85" r="' + R + '" fill="none" stroke="#E4D5C2" stroke-width="16"/>' +
      '<circle class="arc" id="arc" data-to="' + (C * p / 100) + '" cx="85" cy="85" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 ' + C + '"/></svg>' +
      '<div class="v"><b>' + Math.round(p) + '%</b><span>результат</span></div></div>' +
      '<div class="res-grid" style="margin-top:14px"><div><b>' + fmtN(r.score) + '</b><span>из ' + fmtN(r.maxScore) + '</span></div>' +
      '<div><b>' + (r.grade || '—') + '</b><span>оценка</span></div><div><b>' + (r.durationS != null ? mmss(r.durationS) : '—') + '</b><span>время</span></div></div></div>' +
    (r.certificate ? '<button class="btn in" style="animation-delay:300ms" onclick="certificate()">Скачать сертификат</button>' : '') +
    (review ? '<div class="card"><h3 style="margin:0">Разбор ответов</h3>' + review + '</div>' : '') +
    (PREVIEW ? '<button class="btn ghost" onclick="location.reload()">Пройти ещё раз</button>' : '') + '</div>';
}
function animateRing() {
  var el = document.getElementById('arc'); if (!el) return;
  requestAnimationFrame(function () { requestAnimationFrame(function () { el.setAttribute('stroke-dasharray', el.dataset.to + ' 999'); }); });
}
function fmtN(x) { return x == null ? '—' : (Math.round(x * 10) / 10).toString().replace('.', ','); }

/* ---------- сертификат (картинка PNG) ---------- */
function certificate() {
  var F = 'Gilroy, Manrope, Arial';
  var ready = document.fonts && document.fonts.load ? Promise.all(['800 40px Gilroy', '400 40px Gilroy', '800 40px Manrope', '400 40px Manrope'].map(function (f) { return document.fonts.load(f).catch(function () {}); })) : Promise.resolve();
  ready.then(function () { drawCertificate(F); });
}
function drawCertificate(F) {
  var r = S.result, c = document.createElement('canvas'), W = 1600, H = 1130; c.width = W; c.height = H;
  var x = c.getContext('2d'), col = r.color || '#284F36';
  x.fillStyle = '#F5EEDF'; x.fillRect(0, 0, W, H);
  function blob(path, fill) { x.fillStyle = fill; x.fill(new Path2D(path)); }
  x.save(); x.translate(W - 330, -40); x.scale(1.9, 1.9);
  blob('M40 0h160v150c-30 10-55-10-62-40-8-34-40-30-70-46C40 50 20 20 40 0z', '#284F36'); blob('M110 0h90v40c-25 12-55 0-70-14-8-8-15-16-20-26z', '#D85B21'); x.restore();
  x.save(); x.translate(-90, H - 330); x.scale(1.8, 1.8);
  blob('M0 30c50-10 95 20 110 70 12 40 40 70 90 100H0z', '#1F3954'); blob('M0 110c35 0 60 25 70 90H0z', '#284F36'); x.restore();
  x.save(); x.translate(W - 190, H - 250); x.scale(1.7, 1.7); blob('M120 0v160H10c20-30 25-60 50-90C80 45 95 10 120 0z', '#D85B21'); x.restore();
  x.textAlign = 'center'; x.fillStyle = col;
  x.font = '800 104px ' + F; x.fillText('СЕРТИФИКАТ', W / 2, 270);
  x.fillStyle = '#1F3954'; x.font = '400 38px ' + F; x.fillText('подтверждает, что', W / 2, 360);
  x.font = '800 84px ' + F; fitText(x, r.name, W / 2, 480, W - 420, 84);
  x.font = '400 38px ' + F; x.fillText(r.certificate.text, W / 2, 570);
  x.fillStyle = '#D85B21'; x.font = '800 54px ' + F; fitText(x, '«' + r.title + '»', W / 2, 660, W - 420, 54);
  x.fillStyle = '#1F3954'; x.font = '800 40px ' + F;
  x.fillText('Результат: ' + Math.round(r.percent) + '%' + (r.grade ? ' · оценка ' + r.grade : ''), W / 2, 790);
  x.fillStyle = '#5B6B7C'; x.font = '400 32px ' + F;
  x.fillText(new Date(r.finishedAt || Date.now()).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'}), W / 2, 900);
  var fname = 'Сертификат — ' + r.name + '.png';
  c.toBlob(function (blob) {
    if (!blob) return;
    // iPhone: «Поделиться» → «Сохранить изображение» (в Фото); остальные — обычное скачивание
    try {
      var file = new File([blob], fname, {type: 'image/png'});
      if (navigator.canShare && navigator.canShare({files: [file]}) && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
        navigator.share({files: [file], title: 'Сертификат'}).catch(function () {}); return;
      }
    } catch (e) {}
    var url = URL.createObjectURL(blob), link = document.createElement('a');
    link.download = fname; link.href = url; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }, 'image/png');
}
function fitText(x, t, cx, y, maxW, size) {
  var f = x.font; while (x.measureText(t).width > maxW && size > 30) { size -= 4; x.font = f.replace(/\d+px/, size + 'px'); }
  x.fillText(t, cx, y);
}

load(); render();
</script>
