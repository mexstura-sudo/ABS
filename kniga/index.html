<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>История АБС</title>
<meta name="description" content="Книга об истории «Байкальского скаута»: страницы открываются словами с листиков, спрятанных в интерактивах">
<meta name="theme-color" content="#284F36">
<link href="../assets/fonts/manrope.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/* Книга «История АБС»: дети собирают слова с листиков на страницах интерактивов; любое верное слово открывает следующую страницу.
   Бежевый фон сайта, книга — зелёный переплёт и страницы цвета слоновой кости; иллюстрации в стиле сайта. */
:root{
  --green:#284F36;--green2:#3E6B4C;--orange:#D85B21;--navy:#1F3954;--sand:#E4D5C2;--cream:#F5EEDF;--paper:#FFFDF8;--page:#FBF6EA;--muted:#5B6B7C;--ink:#1F3954;
  --line:rgba(31,57,84,.12);--shadow:rgba(31,57,84,.14);--red:#C8412B;
  --font:"Manrope",Gilroy,system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Lora",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
body{background:var(--cream);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;overflow-x:clip}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{position:relative;max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.blob{position:absolute;pointer-events:none;z-index:0}
.hero{position:relative;z-index:1;padding-block:44px 8px}
.kick{font-size:13px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:1.5px}
.kick a{text-decoration:none;color:inherit}
h1{font-size:clamp(34px,7vw,52px);line-height:1.03;margin:8px 0 0;font-weight:800;letter-spacing:-.5px}
.lead{font-size:17px;color:var(--muted);margin:12px 0 0;max-width:52ch}

/* сбор слов */
.collect{position:relative;z-index:1;background:var(--paper);border-radius:26px;padding:16px;box-shadow:0 10px 30px var(--shadow);margin-top:20px;display:flex;flex-direction:column;gap:12px}
.leaves{display:flex;gap:6px;justify-content:space-between}
.lf{flex:1;max-width:46px;aspect-ratio:1;position:relative}
.lf svg{width:100%;height:100%;display:block}
.lf .lfb{fill:#EDE3D1;stroke:#CDBFA6;stroke-width:3;stroke-dasharray:6 5;transition:fill .5s,stroke .5s}
.lf .lfl{fill:#CDBFA6;transition:fill .5s}
.lf.on .lfb{fill:var(--green);stroke:var(--green);stroke-dasharray:none}
.lf.on .lfl{fill:#F5EEDF}
.lf.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{40%{transform:scale(1.3) rotate(-10deg)}}
.cnt{font-size:14px;font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.form{display:flex;gap:8px}
.form input{flex:1;min-width:0;border:0;border-radius:16px;background:var(--cream);padding:14px 16px;font-size:18px;font-weight:800;letter-spacing:1px;text-transform:uppercase;outline:none;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s}
.form input:focus{box-shadow:inset 0 0 0 2px var(--green)}
.form input::placeholder{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}
.form button{border:0;border-radius:16px;padding:0 18px;background:var(--green);color:#fff;font-weight:800;font-size:16px;cursor:pointer;white-space:nowrap}
.form.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.msg{min-height:20px;font-size:14px;font-weight:700;text-align:center}
.msg.bad{color:var(--red)}.msg.ok{color:var(--green)}

/* книга */
.bookbox{position:relative;z-index:1;margin-top:22px}
.stage{position:relative;perspective:2200px}
.book{position:relative;background:var(--page);border-radius:6px 18px 18px 6px;min-height:520px;
  box-shadow:inset 18px 0 22px -14px rgba(60,40,10,.28),inset -2px 0 0 #E8DDC6,0 2px 0 #E6DAC2,0 4px 0 #EFE6D3,0 6px 0 #E2D5BB,0 18px 36px var(--shadow)}
.book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:6px 0 0 6px;background:linear-gradient(90deg,#284F36,#3E6B4C)}
.pg{padding:26px 22px 22px 34px;display:flex;flex-direction:column;gap:14px}
.pg .ch{font-size:12px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1.6px}
.pg h2{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin:-6px 0 0}
.pg .sub{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:-8px}
.art{border-radius:14px;overflow:hidden;background:#EADFCB;box-shadow:inset 0 0 0 1px rgba(31,57,84,.08)}
.art svg{display:block;width:100%;height:auto}
.txt{font-family:var(--serif);font-size:17px;line-height:1.65;color:#2A3442;display:flex;flex-direction:column;gap:12px}
.txt p{margin:0;text-indent:1.2em}
.txt p:first-child{text-indent:0}
.txt p:first-child::first-letter{float:left;font-size:3.1em;line-height:.9;padding:4px 8px 0 0;color:var(--green);font-weight:600}
.folio{text-align:center;font-family:var(--serif);color:var(--muted);font-size:14px;margin-top:6px}
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:20px 0;color:var(--muted);font-family:var(--serif);font-style:italic}

/* обложка */
.cover{position:relative;min-height:520px;border-radius:6px 18px 18px 6px;background:radial-gradient(120% 90% at 30% 20%,#356246,#22442F 70%);color:#F5EEDF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px;overflow:hidden;
  box-shadow:inset 14px 0 18px -10px rgba(0,0,0,.45),0 18px 36px var(--shadow)}
.cover::after{content:"";position:absolute;inset:14px 14px 14px 24px;border:2px solid rgba(245,238,223,.35);border-radius:4px 12px 12px 4px;pointer-events:none}
.cover .lily{width:120px;height:120px;color:#E9A53B;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{transform:translateY(-4px);filter:drop-shadow(0 0 18px rgba(233,165,59,.6))}}
.cover .t{font-family:var(--serif);font-size:42px;font-weight:600;line-height:1.05}
.cover .s{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.8}
.cover .h{font-size:15px;font-weight:600;opacity:.85;max-width:30ch}

/* закрытая страница */
.locked{min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:30px 30px 30px 40px;color:var(--muted)}
.locked .lily{width:90px;height:90px;color:#D8CCB5}
.locked b{font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:600}
.locked .lock{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:var(--orange)}

/* перелистывание */
.flip{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;z-index:5;pointer-events:none}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:6px 18px 18px 6px;background:var(--page)}
.flip .face.back{transform:rotateY(180deg);background:linear-gradient(90deg,#F4EDDD,#FBF6EA);box-shadow:inset -18px 0 24px -14px rgba(60,40,10,.25)}
.flip .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.18));opacity:0;pointer-events:none}
.flip.fwd{animation:fwd .9s cubic-bezier(.45,.05,.3,1) forwards}
.flip.bwd{animation:bwd .9s cubic-bezier(.45,.05,.3,1) forwards}
.flip.fwd .shade{animation:sh .9s forwards}.flip.bwd .shade{animation:sh .9s reverse forwards}
@keyframes fwd{from{transform:rotateY(0)}to{transform:rotateY(-178deg)}}
@keyframes bwd{from{transform:rotateY(-178deg)}to{transform:rotateY(0)}}
@keyframes sh{50%{opacity:1}100%{opacity:0}}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.nb{width:48px;height:48px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 6px 16px var(--shadow),inset 0 0 0 2px var(--sand);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);transition:opacity .3s,transform .15s}
.nb.next{background:var(--green);color:#fff;box-shadow:0 6px 16px var(--shadow)}
.nb svg{width:22px;height:22px}
.nb:active{transform:scale(.92)}
.nb:disabled{opacity:.25;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--sand);transition:background .3s,transform .3s}
.dots i.open{background:var(--green2)}
.dots i.now{background:var(--orange);transform:scale(1.35)}

/* анимации иллюстраций: работают только на открытой странице (.live) */
.art svg .blink,.art svg .talkA,.art svg .talkB,.art svg .nod,.art svg .nod2,.art svg .tilt,.art svg .listen,.art svg .look,.art svg .look2,.art svg .breath,.art svg .hop,.art svg .reach,.art svg .explain,.art svg .strum,.art svg .wave,.art svg .ear,.art svg .legA,.art svg .legB,.art svg .drift,.art svg .twinkle,.art svg .flame,.art svg .spark,.art svg .glow,.art svg .lfall,.art svg .peck,.art svg .sway,.art svg .cycA,.art svg .cycB,.art svg .cone,.art svg .hand1,.art svg .hand2,.art svg .liftbook,.art svg .bubA,.art svg .bubB,.art svg .flag,.art svg .note,.art svg .flut,.art svg .ring,.art svg .ringtx,.art svg .wv,.art svg .travel,.art svg .steam,.art svg .spk,.art svg .door,.art svg .glowdoor,.art svg .idea,.art svg .pen,.art svg .march,.art svg .swing,.art svg .smoke,.art svg .spirit,.art svg .rise,.art svg .blink2,.art svg .dash,.art svg .needle,.art svg .tailw,.art svg .fhead{transform-box:fill-box}
.tailw{transform-origin:100% 80%}.fhead{transform-origin:0 100%}
.live .tailw{animation:tailw 1.6s ease-in-out infinite alternate}
@keyframes tailw{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.live .fhead{animation:fhead 2.4s ease-in-out infinite}
@keyframes fhead{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg) translateY(-1px)}}
.blink{transform-origin:center}.talkA,.talkB{transform-origin:center}
.nod,.nod2,.tilt,.listen,.look,.look2{transform-origin:50% 100%}
.reach,.explain,.strum,.wave,.ear,.legA,.legB{transform-origin:50% 0}
.flame{transform-origin:50% 100%}.glow{transform-origin:center}
.peck{transform-origin:48% 92%}.sway{transform-origin:50% 100%}
.hand1,.hand2{transform-origin:50% 100%}
.flag{transform-origin:0 50%}.flut{transform-origin:50% 0}.ring{transform-origin:50% 100%}
.wv{transform-origin:0 50%;opacity:0}.spk{transform-origin:center}.door{transform-origin:0 50%}
.pen{transform-origin:50% 0;opacity:0}.march{opacity:0}
.cycB,.bubA,.bubB,.idea,.spirit,.ringtx{opacity:0}
.spirit{transform-origin:center}.idea{transform-origin:center}

.live .blink{animation:eye 4.2s infinite}
@keyframes eye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.live .breath,.live .hop{animation:breath 3s ease-in-out infinite}
@keyframes breath{50%{transform:translateY(-1.5px)}}
.live .nod{animation:nod 3.4s ease-in-out infinite}.live .nod2{animation:nod 3s ease-in-out infinite reverse}
@keyframes nod{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.live .tilt{animation:tilt 8s ease-in-out infinite}
@keyframes tilt{0%,40%{transform:rotate(-6deg)}50%,90%{transform:rotate(5deg)}}
.live .listen{animation:listen 4s ease-in-out infinite}
@keyframes listen{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(9deg)}}
.live .look{animation:look 6s ease-in-out infinite}.live .look2{animation:look 6s ease-in-out infinite reverse}
@keyframes look{0%,100%{transform:rotate(-8deg) translateY(1px)}50%{transform:rotate(6deg)}}
.live .talkA{animation:talk 6s infinite}.live .talkB{animation:talk 6s infinite;animation-delay:-3s}
@keyframes talk{0%,4%,12%,20%,28%,36%,44%{transform:scaleY(1)}8%,16%,24%,32%,40%,46%,100%{transform:scaleY(.25)}}
.live .bubA{animation:bub 6s infinite}.live .bubB{animation:bub 6s infinite;animation-delay:-3s}
@keyframes bub{0%{opacity:0;transform:translateY(6px) scale(.8)}6%,40%{opacity:1;transform:none}48%,100%{opacity:0;transform:translateY(-4px)}}
.live .reach{animation:reach 6s ease-in-out infinite}
@keyframes reach{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-14deg)}}
.live .explain{animation:explain 1.4s ease-in-out infinite}
@keyframes explain{50%{transform:rotate(-22deg)}}
.live .strum{animation:strum .45s ease-in-out infinite alternate}
@keyframes strum{to{transform:rotate(14deg)}}
.live .wave{animation:wave .9s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-16deg)}to{transform:rotate(18deg)}}
.live .ear{animation:ear 4s ease-in-out infinite}
@keyframes ear{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(6deg)}}
.live .legA{animation:leg .5s ease-in-out infinite alternate}.live .legB{animation:leg .5s ease-in-out infinite alternate-reverse}
@keyframes leg{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.live .drift{animation:drift 14s ease-in-out infinite alternate;animation-delay:calc(var(--d,0) * 1s)}
@keyframes drift{to{transform:translateX(40px)}}
.live .twinkle{animation:tw 2.6s ease-in-out infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes tw{50%{opacity:.2}}
.live .flame{animation:flick .35s ease-in-out infinite alternate}.live .f2{animation-duration:.28s}.live .f3{animation-duration:.22s}
@keyframes flick{from{transform:scale(1,.86) skewX(-4deg)}to{transform:scale(.94,1.08) skewX(4deg)}}
.live .glow{animation:glw 1.6s ease-in-out infinite alternate}
@keyframes glw{to{transform:scale(1.12);opacity:.4}}
.live .spark{animation:spark 2.7s ease-out infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(8px,-70px);opacity:0}}
.live .lfall{animation:lfall 6s linear infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes lfall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(-40px,150px) rotate(320deg);opacity:.6}}
.live .peck{animation:peck 2.2s ease-in-out infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes peck{0%,55%,100%{transform:none}66%,80%{transform:rotate(26deg)}72%{transform:rotate(30deg)}}
.live .sway{animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2deg)}}
.live .cycA{animation:cycA 8s infinite}.live .cycB{animation:cycB 8s infinite}
@keyframes cycA{0%,40%{opacity:1}48%,92%{opacity:0}100%{opacity:1}}
@keyframes cycB{0%,44%{opacity:0;transform:scale(.8)}52%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
.cross{stroke-dasharray:70;stroke-dashoffset:70}
.live .cross{animation:cross 8s infinite}
@keyframes cross{0%,20%{stroke-dashoffset:70}32%,100%{stroke-dashoffset:0}}
.live .cone{animation:cone 2.6s ease-in-out infinite}
@keyframes cone{50%{opacity:.2}}
.live .hand1{animation:spin 2s linear infinite}.live .hand2{animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.live .liftbook{animation:lift 6s ease-in-out infinite}
@keyframes lift{0%,100%{transform:none}40%,60%{transform:translate(-26px,-6px) rotate(-8deg)}}
.dash{stroke-dashoffset:0}
.live .dash{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.live .flag{animation:flag 1.2s ease-in-out infinite alternate}
@keyframes flag{from{transform:skewY(-5deg) scaleX(.95)}to{transform:skewY(5deg)}}
.live .note{animation:note 3.3s ease-out infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes note{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(30px,-80px) rotate(20deg);opacity:0}}
.live .flut{animation:flut 2s ease-in-out infinite alternate;animation-delay:calc(var(--d,0) * 1s)}
@keyframes flut{to{transform:rotate(8deg) translateY(-3px)}}
.live .ring{animation:ring 3s infinite}
@keyframes ring{0%,40%,100%{transform:none}44%,52%,60%,68%{transform:rotate(-12deg) translateY(-3px)}48%,56%,64%,72%{transform:rotate(12deg) translateY(-3px)}76%{transform:none}}
.live .ringtx{animation:ringtx 3s infinite}
@keyframes ringtx{0%,40%{opacity:0;transform:translateY(4px)}46%,72%{opacity:1;transform:none}80%,100%{opacity:0}}
.live .wv{animation:wv 1.6s ease-out infinite}
@keyframes wv{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.live .travel{animation:travel 3.2s linear infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateX(130px);opacity:0}}
.live .steam{animation:steam 2.1s ease-out infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
.live .spk{animation:spk .3s ease-in-out infinite alternate}
@keyframes spk{to{transform:scale(1.25)}}
.live .door{animation:door 6s ease-in-out infinite}
@keyframes door{0%,20%{transform:none}40%,85%{transform:scaleX(.25)}100%{transform:none}}
.live .glowdoor{animation:gd 6s ease-in-out infinite}
@keyframes gd{0%,20%{opacity:.6}40%,85%{opacity:1}}
.live .idea{animation:idea 6s ease-in-out infinite}
@keyframes idea{0%,30%{opacity:0;transform:scale(.4) translateY(10px)}40%,85%{opacity:1;transform:none}95%,100%{opacity:0}}
.live .pen{animation:penIn .6s cubic-bezier(.2,.9,.3,1.5) forwards,penSway 3s ease-in-out infinite;animation-delay:calc(var(--d) * 1s),calc(var(--d) * 1s + .6s)}
@keyframes penIn{to{opacity:1;transform:none}}
@keyframes penSway{0%,100%{opacity:1;transform:rotate(0)}50%{opacity:1;transform:rotate(4deg)}}
.pen{transform:scale(.3) rotate(-20deg)}
.live .march{animation:march .8s ease-out forwards;animation-delay:calc(var(--d) * 1s)}
@keyframes march{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.live .hop{animation:hop 1.8s ease-in-out infinite;animation-delay:calc(var(--d,0) * 1s + .8s)}
@keyframes hop{0%,70%,100%{transform:none}80%{transform:translateY(-6px)}}
.live .swing{animation:swing 3.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.live .smoke{animation:smoke 4.8s ease-out infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(14px,-130px) scale(3);opacity:0}}
.live .spirit{animation:spirit 6s ease-in-out infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes spirit{0%{opacity:0;transform:translateY(16px) scale(.7)}12%,30%{opacity:.95;transform:none}42%,100%{opacity:0;transform:translateY(-14px) scale(1.05)}}
.live .rise{animation:rise 3.4s ease-in-out infinite}
@keyframes rise{0%,100%{transform:translateY(3px)}50%{transform:translateY(-6px)}}
.live .blink2{animation:b2 1.4s steps(2) infinite}
@keyframes b2{50%{opacity:.25}}

.needle{transform-origin:center}.live .needle{animation:needle 4s ease-in-out infinite}
@keyframes needle{50%{transform:translateX(6px)}}

.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.end{padding-block:30px 60px;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:520px){.pg{padding:22px 16px 18px 26px}.pg h2{font-size:26px}.txt{font-size:16px}.book,.cover,.locked{min-height:480px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <svg class="blob" aria-hidden="true" viewBox="0 0 200 160" style="right:-50px;top:-20px;width:220px;height:176px"><path d="M40 0h160v150c-30 10-55-10-62-40-8-34-40-30-70-46C40 50 20 20 40 0z" fill="#284F36"/><path d="M110 0h90v40c-25 12-55 0-70-14-8-8-15-16-20-26z" fill="#D85B21"/></svg>
  <header class="hero">
    <div class="kick">Байкальский скаут · Книга</div>
    <h1>История АБС</h1>
    <p class="lead">На страницах интерактивов спрятаны 7 листиков со скаутской лилией. Найди листик, узнай слово и впиши его сюда — книга откроет новую страницу.</p>
  </header>

var PAGES = [{"k": "Глава 1 · История", "t": "Случайности, которые не случайны", "sub": "Октябрь 1991 года", "p": ["В хрониках АБС написано коротко: в октябре 1991 года встретились Анна Шободоева, Ольга Ефименко, Алексей Васильков, Андрей Сергиенко. Все верно, но за этой строчкой – целая цепочка случайностей, которые оказались не случайны. Позже Ольга Ефименко вспоминала, что впервые познакомилась с инициативной группой только весной 1992 года, но так или иначе, осенью 1991-го в Иркутске собрались люди, которым было что сказать друг другу.", "У Анны Шободоевой все началось с диссертации. Ей было тридцать три: семья, сын, кандидатская степень и отпуск, взятый ради докторской. В Москве, в библиотеке имени Ленина, она собирала материалы об истории детского и молодежного движения – о том его русле, что шло в стороне от коммунистических идеалов. О скаутах Анна знала понаслышке, из советских книжек, где скаут – толстый сын буржуя, помогающий белым и враждующий с пионерами."]}, {"k": "Глава 1 · История", "t": "Встреча в читальном зале", "sub": "Москва, библиотека имени Ленина", "p": ["А в каталоге «Ленинки» вдруг нашелся целый раздел о скаутском движении. Часть книг уже выдавали свободно – раньше они лежали в спецхране. Но нужные Анне тома кто-то взял раньше нее. Пришлось идти по читальному залу и искать. На одном из столов лежали ее книги, а рядом – молодой человек, представившийся Андреем Вахтиным.", "Именно от него Анна узнала то, чего не было ни в одном каталоге: скаутинг в России живет и возрождается. Не страница истории, а настоящее дело. Разговоры затянулись надолго, и где-то между ними родилась мысль: а стоит ли писать еще одну абстрактную диссертацию? Может, сначала попробовать создать что-то подобное в Иркутске – свою опытную площадку?"]}, {"k": "Глава 1 · История", "t": "Теория встречает практику", "sub": "", "p": ["Идея ждала своего часа, и снова помог случай. Сосед Анны по общежитию рассказал, что у его друга, студента Алексея Василькова, курсовая по педагогике – и тема ее – скаутинг. Алексей оказался не просто студентом: он ездил в пионерские лагеря с педагогическим отрядом «Труверы» и знал работу с подростками не только по книжкам. Анна позже называла эту встречу эпохальной для АБС: теория наконец встретилась с практикой."]}, {"k": "Глава 2 · Люди", "t": "Нужны единомышленники", "sub": "Иркутск, осень 1991 года", "p": ["Плана не было. Было понимание: нужны единомышленники. Пошли во Дворец пионеров, в городской отдел по делам молодежи, на радио. Время оказалось подходящим: в пылу перемен «хоронили» и пионерию, и комсомол, а взамен никто ничего не предлагал.", "Легко, конечно, не было. На встречах с педагогами скаутинг порой ассоциировали с чем угодно – вплоть до фашизма. Но агитация и разговоры делали свое дело: постепенно начали звонить люди, которым стали интересны новые формы работы с детьми. Помещения у организации не было, и первое время собирались почти подпольно – в методическом кабинете «нархоза» (ныне – Байкальский Государственный Университет), где работала Анна."]}, {"k": "Глава 2 · Люди", "t": "Голос по радио", "sub": "ул. Декабрьских Событий, 107Б", "p": ["Все изменило одно из ее выступлений по радио. Его услышал отец Александра Верхозина. Сам Александр занимался туризмом с подростками и вел клуб «Сарма», у которого было собственное постоянное место – подвал. Этот подвал по адресу: ул. Декабрьских Событий, д. 107Б стал на долгие годы домом иркутского скаутинга: здесь собирались, репетировали, готовились к лагерям (и только в прошлом году АБС попрощался со своей родной штаб-квартирой: увы, техническое состояние помещения было признано аварийным)."]}, {"k": "Глава 2 · Люди", "t": "Первые отряды", "sub": "1991–1992", "p": ["Первый шаг зачинатели АБС сделали верно: сначала – база, методика, взрослые лидеры, и только потом – отряды. 20 октября 1991 года появилась «Акула» Андрея Сергиенко, следом «Соболь» Алексея Василькова, «Байкал» Андрея Тепляшина. 13 декабря ряды пополнил отряд «Арго» Ольги Ефименко, в феврале к ним присоединился отряд «Сарма» Александра Верхозина, а 28 апреля – «Ирбис» Ирины Борисенко."]}, {"k": "Глава 2 · Люди", "t": "День рождения и лесное имя", "sub": "30 октября 1991 года", "p": ["30 октября 1991 года считается официальной датой рождения АБС. В январе 1992 года организация зарегистрировалась как «Иркутская ассоциация возрождения скаутов», а в мае получила имя, которое теперь знает каждый: Ассоциация «Байкальский скаут» (годы и требования законодательства взяли свое – сейчас мы носим гордое название Иркутская областная общественная организация детей и молодежи «Байкальский скаут», но согласитесь: душе ближе все-таки родная аббревиатура – АБС!).", "И почти сразу же родилась традиция, которая живет до сих пор: лесное имя. Каждый, кто приходит в организацию, при желании (хотя бывали и исключения…) рано или поздно получает свое «природное» имя – Багира, Соболь, Фретка. Особое имя в качестве напоминания: здесь – твой дом, тебя здесь всегда любят и ждут."]}];

    '<g transform="translate(26 150)"><rect x="24" y="20" width="5" height="44" fill="#6E4630"/><rect width="54" height="26" rx="4" fill="#8A5A3A"/><path d="M4 8 h46 M4 18 h46" stroke="#6E4630" stroke-width=".8" opacity=".6"/><circle cx="4" cy="4" r="1.3" fill="#4E3020"/><circle cx="50" cy="4" r="1.3" fill="#4E3020"/>' + T(27, 12, 'АБС', 10, '#F5EEDF') + T(27, 22, '30.10.1991', 7, '#F2C55C') + '</g>' +
    A('rise', lily(200, 120, 26, '#E9A53B')) +
    '</svg>';
}
var ARTS = [art1, art2, art3, art4, art5, art6, art7];

// ---------- страницы ----------
function pageHtml(i) {
  var c = PAGES[i];
  return '<div class="book"><div class="pg"><div class="ch">' + c.k + '</div><h2>' + c.t + '</h2>' + (c.sub ? '<div class="sub">' + c.sub + '</div>' : '') +
    '<div class="art">' + ARTS[i]() + '</div><div class="txt">' + c.p.map(function (t) { return '<p>' + t + '</p>'; }).join('') + '</div><div class="folio">— ' + (i + 1) + ' —</div></div></div>';
}
function coverHtml() { return '<div class="cover"><div class="lily">' + LILY + '</div><div class="s">Байкальский скаут</div><div class="t">История<br>АБС</div><div class="h">7 страниц. Каждая открывается словом с листика.</div></div>'; }
function lockedHtml(i) { return '<div class="book"><div class="locked"><div class="lily">' + LILY + '</div><div class="lock">Страница закрыта</div><b>Страница ' + (i + 1) + '</b><div>Найди листик со скаутской лилией на странице одного из интерактивов и впиши слово выше.</div></div></div>'; }

// ---------- состояние ----------
var KEY = 'abs-book-v1', used = [];
try { used = JSON.parse(localStorage.getItem(KEY) || '[]').filter(function (w) { return VALID.indexOf(w) >= 0; }); } catch (e) { used = []; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(used)); } catch (e) {} }
var view = used.length ? used.length : 0; // 0 — обложка, 1..7 — главы, 8 — следующая закрытая
function maxView() { return Math.min(7, used.length + 1); }
function html(v) { return v === 0 ? coverHtml() : v <= used.length ? pageHtml(v - 1) : lockedHtml(v - 1); }
var slot = document.getElementById('slot'), stage = document.getElementById('stage'), busy = false;
function paint() { slot.innerHTML = html(view); slot.firstChild.classList.add('live'); ui(); }
function ui() {
  var lv = document.getElementById('leaves');
  lv.innerHTML = WORDS.map(function (_, i) { return '<div class="lf' + (i < used.length ? ' on' : '') + '" aria-hidden="true">' + LEAF('lf') + '</div>'; }).join('');
  document.getElementById('cnt').textContent = used.length < 7 ? 'Собрано листиков: ' + used.length + ' из 7' : 'Все 7 листиков собраны — книга открыта целиком!';
  document.getElementById('dots').innerHTML = Array.from({length: 8}, function (_, v) { return '<i class="' + (v <= used.length ? 'open' : '') + (v === view ? ' now' : '') + '"></i>'; }).join('');
  document.getElementById('prev').disabled = busy || view <= 0;
  document.getElementById('next').disabled = busy || view >= maxView();
}
function go(to) {
  if (busy || to === view || to < 0 || to > maxView()) return;
  var fwd = to > view, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { view = to; paint(); return; }
  busy = true;
  var oldH = html(view), newH = html(to);
  var f = document.createElement('div'); f.className = 'flip ' + (fwd ? 'fwd' : 'bwd');
  f.innerHTML = '<div class="face front">' + (fwd ? oldH : newH) + '</div><div class="face back"></div><div class="shade"></div>';
  slot.innerHTML = fwd ? newH : oldH;
  var under = slot.firstChild; if (fwd) under.classList.add('live'); else f.firstChild.firstChild.classList.add('live');
  stage.appendChild(f);
  view = to; ui();
  setTimeout(function () { f.remove(); if (!fwd) { slot.innerHTML = newH; slot.firstChild.classList.add('live'); } busy = false; ui(); }, 920);
  if (!fwd || to > 0) stage.scrollIntoView({behavior: 'smooth', block: 'start'});
}
document.getElementById('prev').onclick = function () { go(view - 1); };
document.getElementById('next').onclick = function () { go(view + 1); };
var tx = null;
stage.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, {passive: true});
stage.addEventListener('touchend', function (e) { if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50) go(view + (dx < 0 ? 1 : -1)); }, {passive: true});

var msg = document.getElementById('msg'), form = document.getElementById('form'), inp = document.getElementById('word');
function say(t, ok) { msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'bad'); }
form.addEventListener('submit', function (e) {
  e.preventDefault(); var w = norm(inp.value);
  if (!w) return say('Впиши слово с листика', false);
  if (used.length >= 7) return say('Книга уже открыта целиком', true);
  if (used.indexOf(w) >= 0) { form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); return say('Это слово уже открыло страницу — ищи другой листик', false); }
  if (VALID.indexOf(w) < 0) { form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); return say('Такого слова нет. Проверь, как написано на листике', false); }
  used.push(w); save(); inp.value = '';
  var n = used.length;
  say(n < 7 ? 'Верно! Открывается страница ' + n : 'Верно! Ты собрал всю книгу!', true);
  ui(); var lf = document.querySelectorAll('.lf')[n - 1]; if (lf) lf.classList.add('pop');
  view = Math.max(0, n - 1); paint(); setTimeout(function () { go(n); }, 250);
  if (n === 7) setTimeout(confetti, 1100);
});
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cols = ['#D85B21', '#284F36', '#E9A53B', '#1F3954', '#7DD6A1'];
  for (var i = 0; i < 70; i++) { var c = document.createElement('div'); c.className = 'conf'; c.style.left = Math.random() * 96 + 'vw'; c.style.background = cols[i % cols.length]; c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's'; c.style.animationDelay = Math.random() * .5 + 's'; document.body.appendChild(c); setTimeout(c.remove.bind(c), 4200); }
}

paint();
})();
</script>
