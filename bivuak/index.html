<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бивуак — ставим лагерь правильно</title>
<meta name="description" content="Как правильно поставить лагерь: место, палатка, кухня, санитария, утро — по шагам">
<meta name="theme-color" content="#121C17">
<link href="../assets/fonts/manrope.css" rel="stylesheet">
<style>
/* Статья «Бивуак — ставим лагерь правильно» (страница bivuak/). Фон — сцена лагеря, которая достраивается по мере прокрутки.
   Телефон: сцена закреплена в верхней части экрана, карточки идут снизу. Компьютер: сцена слева, карточки справа. */
:root{
  --green:#8FCB9F;--orange:#F38A55;--sand:#34443A;--cream:#121C17;--paper:#1B2A22;--muted:#A3B5AA;--ink:#EEE6D6;
  --line:rgba(238,230,214,.12);--shadow:rgba(0,0,0,.35);--on:#121C17;
  --peach:#43281C;--peach-c:#FFA77A;--sky:#1B3348;--sky-c:#86C2F2;--sun:#3D3216;--sun-c:#F2C55C;
  --mint:#1D3A29;--mint-c:#7DD6A1;--aqua:#173A39;--aqua-c:#6FD3CF;
  --font:"Manrope",Gilroy,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html{overflow-x:clip}
@media (pointer:coarse){html{scroll-snap-type:y proximity}}
body{background:var(--cream);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;overflow-x:clip}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.c-place{--tc:var(--mint-c);--tb:var(--mint)}.c-tent{--tc:var(--peach-c);--tb:var(--peach)}.c-kitchen{--tc:var(--sun-c);--tb:var(--sun)}
.c-sanit{--tc:var(--sky-c);--tb:var(--sky)}.c-morning{--tc:var(--aqua-c);--tb:var(--aqua)}

/* сцена */
#scene{position:fixed;left:0;top:0;width:100%;height:60vh;z-index:0;display:block}
.fade{position:fixed;left:0;right:0;top:46vh;height:18vh;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(18,28,23,0),var(--cream))}
.floor{position:fixed;left:0;right:0;top:63.5vh;bottom:0;z-index:1;background:var(--cream);pointer-events:none}
.el{opacity:0;transition:opacity .7s,transform .8s cubic-bezier(.2,.9,.3,1.2);transform-box:fill-box;transform-origin:center bottom}
.el.on{opacity:1}
.grow{transform:scale(.2)}.grow.on{transform:none}
.rise{transform:translateY(14px)}.rise.on{transform:none}
.widen{transform:scaleX(0);transform-origin:center}.widen.on{transform:none}
.draw{stroke-dasharray:var(--len,200);stroke-dashoffset:var(--len,200);opacity:1;transition:stroke-dashoffset 1.1s ease-out,opacity .4s}
.draw.on{stroke-dashoffset:0}
.draw:not(.on){opacity:0}
.debris{opacity:1;transition:opacity .6s,transform .8s ease-in}
.debris.gone{opacity:0;transform:translate(60px,-30px) rotate(90deg)}
.flame{animation:flick .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes flick{to{transform:scaleY(.82) scaleX(1.06)}}
.wind path{stroke-dasharray:14 10;animation:wind 1.4s linear infinite}
@keyframes wind{to{stroke-dashoffset:-48}}
.flow path{animation:flow 1.8s linear infinite}
@keyframes flow{from{transform:translateY(-10px);opacity:0}30%{opacity:1}to{transform:translateY(16px);opacity:0}}
.smoke circle{animation:smoke 3.2s ease-out infinite;transform-box:fill-box}
.smoke circle:nth-child(2){animation-delay:1s}.smoke circle:nth-child(3){animation-delay:2s}
@keyframes smoke{from{transform:translate(0,0) scale(.6);opacity:.7}to{transform:translate(26px,-46px) scale(1.8);opacity:0}}
.twinkle{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
.sun{transform:translateY(80px);transition:transform 2.2s cubic-bezier(.2,.8,.2,1),opacity 1s;opacity:0}
.sun.on{transform:none;opacity:1}
.dawn{transition:opacity 2s}
.spark{animation:spark 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spark{50%{transform:scale(.4) rotate(45deg);opacity:.4}}
.trash{transition:opacity .6s,transform 1s cubic-bezier(.5,0,.5,1)}
.trash.packed{opacity:0;transform:translate(-118px,4px) scale(.4)}
.lbl{font:700 9px var(--font);fill:#EEE6D6}

/* контент */
.wrap{position:relative;z-index:2;max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{position:relative;z-index:3;background:var(--cream);padding-block:52px 34px;box-shadow:0 30px 40px var(--cream)}
.hero .in{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.kick{font-size:13px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:1.5px}
h1{font-size:clamp(34px,6vw,52px);line-height:1.05;margin:10px 0 0;font-weight:800;letter-spacing:-.5px;text-wrap:balance}
.lead{font-size:18px;color:var(--muted);margin:14px 0 0;max-width:52ch}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:24px}
.toc a{display:flex;align-items:center;gap:10px;background:var(--tb);border-radius:20px;padding:11px 12px;text-decoration:none;font-weight:800;transition:transform .2s}
.toc a:hover{transform:translateY(-3px)}
.toc a span{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--tc);color:var(--on);flex:none}
.blob{position:absolute;pointer-events:none;right:-60px;top:-60px;width:230px;height:180px}
.story{padding-top:58vh;padding-bottom:40vh;display:flex;flex-direction:column;gap:34vh}
.chap{display:flex;flex-direction:column;gap:14px;scroll-margin-top:62vh}
.chead{display:flex;align-items:center;gap:12px;background:var(--tb);border-radius:22px;padding:14px 16px;font-size:22px;font-weight:800;transition:opacity .4s}
.chead span{width:40px;height:40px;border-radius:14px;background:var(--tc);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.item{display:flex;gap:14px;align-items:flex-start;background:rgba(27,42,34,.94);border-radius:22px;padding:16px 18px;box-shadow:0 10px 30px var(--shadow);font-size:18px;font-weight:700;line-height:1.4;transition:opacity .5s,transform .5s,box-shadow .4s;margin-bottom:34vh;scroll-snap-align:end;scroll-margin-bottom:12vh}
.item:last-child{margin-bottom:0}
.item i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--tc);color:var(--tc);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin-top:-1px;transition:background .3s,color .3s}
.item.act{box-shadow:0 0 0 2px var(--tc),0 14px 34px var(--shadow)}
.item.act i,.item.done i{background:var(--tc);color:var(--on)}
.up{opacity:0;transform:scale(.97)}
.end{text-align:center;color:var(--muted);font-weight:700;transition:opacity .5s}
.tocbtn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:20;border:0;border-radius:999px;background:rgba(27,42,34,.9);color:var(--ink);box-shadow:0 6px 18px var(--shadow);padding:10px 14px;font:800 14px var(--font);cursor:pointer;transition:opacity .3s}
.tocbtn.hide{opacity:0;pointer-events:none}
.step{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:20;border-radius:999px;background:rgba(27,42,34,.9);padding:9px 14px;font-weight:800;font-size:14px;color:var(--tc,var(--green));transition:opacity .3s;font-variant-numeric:tabular-nums}
.step.hide{opacity:0}

@media (min-width:900px){
  #scene{width:58vw;height:100vh}
  .fade,.floor{display:none}
  .wrap{margin:0 0 0 60vw;max-width:440px}
  .story{padding-top:46vh;gap:40vh}
  .chap{scroll-margin-top:30vh}
  .up{opacity:1;transform:none}
  .item{margin-bottom:40vh;scroll-snap-align:center;scroll-margin-bottom:0}
}

/* ===== вариант B: маршрут ===== */
body.vA .rstory,body.vA .rpanel{display:none}
body.vB .story{display:none}
.rstory{position:relative;z-index:2}
.seg{height:62vh;scroll-snap-align:start}
.seg:last-child{height:100vh}
.rpanel{position:fixed;left:0;right:0;top:62vh;bottom:0;z-index:3;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:opacity .4s;display:flex;flex-direction:column;gap:14px}
.rpanel.hide{opacity:0;pointer-events:none}
.trail{position:relative;height:34px;flex:none}
.trail .track{position:absolute;left:8px;right:8px;top:16px;height:0;border-top:3px dashed rgba(238,230,214,.25)}
.trail .done{position:absolute;left:8px;top:15px;height:5px;border-radius:3px;background:var(--tc,var(--green));width:0;transition:width .7s cubic-bezier(.4,0,.2,1),background .4s}
.stop{position:absolute;top:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--cream);box-shadow:inset 0 0 0 2px rgba(238,230,214,.35);transition:background .3s,box-shadow .3s,transform .3s}
.stop.past{background:var(--tc);box-shadow:none}
.stop.now{transform:scale(1.35);background:var(--tc);box-shadow:0 0 0 5px rgba(255,255,255,.12)}
.stop.ch{width:18px;height:18px;margin-left:-9px;top:8px}
.walker{position:absolute;top:-6px;width:26px;height:26px;margin-left:-13px;transition:left .7s cubic-bezier(.4,0,.2,1);color:var(--tc,var(--green));z-index:2}
.walker svg{width:100%;height:100%;animation:hop .7s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-3px)}}
.rcards{position:relative;flex:1;min-height:0}
.rcard{position:absolute;left:0;right:0;top:0;background:rgba(27,42,34,.96);border-radius:24px;padding:16px 18px 18px;box-shadow:0 0 0 2px var(--tc),0 14px 34px var(--shadow);display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateX(40px) scale(.94);pointer-events:none}
.rcard .lab{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--tc)}
.rcard .lab i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--tc);color:var(--on);display:flex;align-items:center;justify-content:center;letter-spacing:0;font-size:12px}
.rcard .tx{font-size:20px;font-weight:800;line-height:1.35}
.rcard.arrive{animation:arrive .75s cubic-bezier(.2,.9,.3,1.25) both}
.rcard.leave{animation:leave .45s ease-in both}
@keyframes arrive{0%{opacity:0;transform:translateX(60px) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes leave{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-34px) scale(.96)}}
.rcard.arrive .tx{animation:txin .6s .25s both}
@keyframes txin{from{opacity:0;transform:translateY(8px)}}
.hint{color:var(--muted);font-weight:700;font-size:15px}
@media (min-width:900px){
  .rpanel{left:60vw;right:0;top:0;bottom:0;padding:0 28px 0 0;flex-direction:row;gap:22px}
  .trail{width:34px;height:auto;margin-block:10vh}
  .trail .track{left:16px;right:auto;top:0;bottom:0;height:auto;border-top:0;border-left:3px dashed rgba(238,230,214,.25)}
  .trail .done{left:15px;top:0;width:5px;height:0;transition:height .7s cubic-bezier(.4,0,.2,1),background .4s}
  .stop{left:17px!important;margin-left:-7px;margin-top:-7px}
  .stop.ch{margin-left:-9px;margin-top:-9px}
  .walker{left:-12px!important;margin-left:0;margin-top:-13px;transition:top .7s cubic-bezier(.4,0,.2,1)}
  .rcards{margin-block:10vh}
  .rcard{right:auto;width:100%;max-width:400px;transition:top .7s cubic-bezier(.4,0,.2,1)}
}

/* извилистая тропа на телефоне */
.mtrail{display:none;position:relative;height:96px;flex:none;overflow:hidden;margin-inline:-16px;touch-action:pan-y}
.mtrail svg{display:block;height:100%;width:100%}
.mtrail .seg-l{fill:none;stroke:rgba(238,230,214,.22);stroke-width:3;stroke-dasharray:5 6;transition:stroke .5s}
.mtrail .seg-l.past{stroke:var(--c);stroke-dasharray:none;stroke-width:4}
.mtrail .st{fill:#121C17;stroke:rgba(238,230,214,.4);stroke-width:2;transition:fill .3s,stroke .3s;cursor:pointer}
.mtrail .st.past{fill:var(--c);stroke:var(--c)}
.mtrail .st.now{fill:var(--c);stroke:#fff;stroke-width:2.5}
.mtrail .num{font:800 9px var(--font);fill:rgba(238,230,214,.6);text-anchor:middle;pointer-events:none}
.mtrail .num.past,.mtrail .num.now{fill:#121C17}
.mtrail .chl{font:800 10px var(--font);text-anchor:middle;text-transform:uppercase;letter-spacing:.8px}
.mtrail #mview,.mtrail #mwalk{transition:transform .7s cubic-bezier(.4,0,.2,1)}
.mtrail #mwalk .bob{animation:hop .7s ease-in-out infinite alternate}
.swipe{font-size:13px;color:var(--muted);font-weight:700}
@media (max-width:899px){ .trail{display:none} .mtrail{display:block} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

</head>

<script>
(function () {
var CH = [
  {id: 'place', name: 'Место', items: ['Ровная площадка, без уклона.', 'Нет камней, шишек, корней под палаткой.', 'Защита от ветра (кусты, валуны, гряда).', 'Не в низине и не на гребне.', 'Вода в 50–100 м, но не у самой воды.', 'Вход палатки — с подветренной стороны.']},
  {id: 'tent', name: 'Палатка', items: ['Подстилка — первой.', 'Дуги перекрещены по центру, концы в гнёздах.', 'Колышки под углом 45°, остриём к палатке.', 'Тент не касается внутренней палатки.', 'Оттяжки натянуты, провисов нет.']},
  {id: 'kitchen', name: 'Кухня', items: ['С подветренной стороны, 5–7 м от палаток.', 'Кострище расчищено (1 м вокруг).', 'Огонь заливается перед сном.']},
  {id: 'sanit', name: 'Санитария', items: ['Туалет — 50–60 м от лагеря и воды.', 'Ниже по течению, если рядом река.']},
  {id: 'morning', name: 'Утром', items: ['Мусор — с собой.', 'Кострище залито.', 'Место чище, чем застали.']}
];
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); };
var FLAT = []; CH.forEach(function (c, ci) { c.items.forEach(function (t) { FLAT.push({n: FLAT.length + 1, t: t, ch: c.name, cid: c.id, ci: ci, first: FLAT.length === 0 || FLAT[FLAT.length - 1].cid !== c.id}); }); });
var TOTAL = FLAT.length, MODE = 'A';
var COL = {}; ['place', 'tent', 'kitchen', 'sanit', 'morning'].forEach(function (k) { var d = document.createElement('div'); d.className = 'c-' + k; document.body.appendChild(d); COL[k] = getComputedStyle(d).getPropertyValue('--tc').trim(); d.remove(); });
document.getElementById('toc').innerHTML = CH.map(function (c, i) { return '<a class="c-' + c.id + '" href="#ch-' + c.id + '" data-cid="' + c.id + '"><span>' + (i + 1) + '</span>' + c.name + '</a>'; }).join('');

// ----- A: лента -----
var n = 0;
document.getElementById('story').innerHTML = CH.map(function (c, i) {

document.getElementById('rcards').innerHTML = '<div class="rcard c-place" data-k="0"><div class="lab">Маршрут</div><div class="tx">Листайте — пройдём 19 пунктов и поставим лагерь.</div><div class="hint">' + CH.map(function (c) { return c.name; }).join(' → ') + '</div><div class="swipe">Листайте вниз или смахивайте карточку ← →</div></div>' +
  FLAT.map(function (f) { return '<div class="rcard c-' + f.cid + '" data-k="' + f.n + '"><div class="lab"><i>' + f.n + '</i>' + esc(f.ch) + ' · ' + f.n + ' из ' + TOTAL + '</div><div class="tx">' + esc(f.t) + '</div></div>'; }).join('') +
  '<div class="rcard c-morning" data-k="end"><div class="lab">Финиш</div><div class="tx">Лагерь собран и убран. Хорошего похода!</div></div>';
var stops = trail.querySelectorAll('.stop'), rcards = document.querySelectorAll('.rcard'), walker = document.getElementById('walker'), tdone = document.getElementById('tdone');
function layoutTrail() {
  var wide = innerWidth >= 900, L = wide ? trail.clientHeight : trail.clientWidth - 16;
  stops.forEach(function (st, i) { var pos = (wide ? 0 : 8) + L * (i + 1) / (TOTAL + 1); if (wide) { st.style.top = pos + 'px'; st.style.left = ''; } else { st.style.left = pos + 'px'; st.style.top = ''; } });
}
function posOf(k) { var wide = innerWidth >= 900, L = wide ? trail.clientHeight : trail.clientWidth - 16; return (wide ? 0 : 8) + L * k / (TOTAL + 1); }
var shown = null;
function showCard(k) {
  if (k === shown) return;
  var wide = innerWidth >= 900;
  rcards.forEach(function (c) {
    var ck = c.getAttribute('data-k'), want = String(k);
    if (ck === want) { c.classList.remove('leave'); c.classList.remove('arrive'); void c.offsetWidth; c.classList.add('arrive'); c.style.pointerEvents = 'auto';
      if (wide) { var top = k === 'end' ? posOf(TOTAL) : posOf(k); var h = c.offsetHeight, H = document.getElementById('rcards').clientHeight; c.style.top = Math.max(0, Math.min(H - h, top - h / 2)) + 'px'; } else c.style.top = '0'; }
    else if (shown !== null && ck === String(shown)) { c.classList.remove('arrive'); void c.offsetWidth; c.classList.add('leave'); c.style.pointerEvents = 'none'; }
    else { c.classList.remove('arrive', 'leave'); c.style.pointerEvents = 'none'; }

// ----- извилистая тропа (телефон) -----
var GAP = 62, MT = document.getElementById('mtrail');

function segP(a, b) { var mx = (a.x + b.x) / 2; return 'M' + a.x + ' ' + a.y + ' C' + mx + ' ' + a.y + ' ' + mx + ' ' + b.y + ' ' + b.x + ' ' + b.y; }
var mh = '<svg viewBox="0 0 390 96" preserveAspectRatio="xMidYMid meet"><g id="mview">';
for (var i = 1; i <= TOTAL; i++) mh += '<path class="seg-l" data-k="' + i + '" style="--c:' + COL[FLAT[i - 1].cid] + '" d="' + segP(PTS[i - 1], PTS[i]) + '"/>';
FLAT.forEach(function (f) {
  var p = PTS[f.n];
  if (f.first) mh += '<text class="chl" x="' + p.x + '" y="' + (p.y + 24) + '" fill="' + COL[f.cid] + '">' + esc(f.ch) + '</text>';
  mh += '<circle class="st" data-k="' + f.n + '" style="--c:' + COL[f.cid] + '" cx="' + p.x + '" cy="' + p.y + '" r="' + (f.first ? 10 : 8.5) + '"/><text class="num" data-k="' + f.n + '" x="' + p.x + '" y="' + (p.y + 3) + '">' + f.n + '</text>';
});
mh += '<g id="mwalk"><g class="bob"><circle r="9" cx="0" cy="-20" fill="#EEE6D6"/><path d="M-5 -16 L0 -26 L5 -16Z" fill="#121C17"/></g></g></g></svg>';
MT.innerHTML = mh;
var mview = document.getElementById('mview'), mwalk = document.getElementById('mwalk');
function moveMobile(s) {
  var p = PTS[Math.max(0, Math.min(TOTAL, s))];
  mview.style.transform = 'translateX(' + (195 - p.x) + 'px)';
  mwalk.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
  MT.querySelectorAll('.seg-l').forEach(function (e) { e.classList.toggle('past', +e.getAttribute('data-k') <= s); });
  MT.querySelectorAll('.st,.num').forEach(function (e) { var k = +e.getAttribute('data-k'); e.classList.toggle('past', k < s); e.classList.toggle('now', k === s); });
}
function goSeg(k) { var sg = document.querySelector('.seg[data-k="' + k + '"]'); if (sg) scrollTo({top: scrollY + sg.getBoundingClientRect().top + 2, behavior: 'smooth'}); }
MT.addEventListener('click', function (e) { var t = e.target.closest('.st'); if (t) goSeg(+t.getAttribute('data-k')); });
var tx0 = null, ty0 = 0, panel = document.getElementById('rpanel');
panel.addEventListener('touchstart', function (e) { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, {passive: true});
panel.addEventListener('touchend', function (e) {
  if (tx0 === null) return; var dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0; tx0 = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) goSeg(Math.max(0, Math.min(TOTAL, Math.max(cur, 0) + (dx < 0 ? 1 : -1))));
}, {passive: true});
// ----- сцена (общая) -----
var scene = document.getElementById('scene'), els = scene.querySelectorAll('[data-in],[data-out],[data-pack]'), items = document.querySelectorAll('.item');
var stepEl = document.getElementById('step'), cur = -1;
function setStage(s) {
  if (s === cur) return; cur = s;
  els.forEach(function (el) {
    var a = el.getAttribute('data-in'), b = el.getAttribute('data-out'), p = el.getAttribute('data-pack');
    if (el.classList.contains('debris')) { el.classList.toggle('gone', s >= +b); return; }
    var on = (a === null || s >= +a) && (b === null || s < +b);
    el.classList.toggle('on', on);
    if (p) { el.classList.toggle('packed', s >= +p); if (s >= +p) el.classList.add('on'); }
  });
  items.forEach(function (it) { var k = +it.getAttribute('data-s'); it.classList.toggle('act', k === s); it.classList.toggle('done', k < s); });
  var f = s ? FLAT[s - 1] : null, col = f ? COL[f.cid] : COL.place;
  stepEl.classList.toggle('hide', !f);
  if (f) { stepEl.textContent = f.ch + ' · ' + s + ' из ' + TOTAL; stepEl.style.setProperty('--tc', col); }
  // маршрут
  var wide = innerWidth >= 900, pos = posOf(Math.max(s, 0));

  if (wide) { walker.style.top = pos + 'px'; walker.style.left = ''; tdone.style.height = pos + 'px'; tdone.style.width = ''; }
  else { walker.style.left = pos + 'px'; walker.style.top = ''; tdone.style.width = Math.max(0, pos - 8) + 'px'; tdone.style.height = ''; }
  stops.forEach(function (st) { var k = +st.getAttribute('data-k'); st.classList.toggle('past', k < s); st.classList.toggle('now', k === s); });

}
function onScroll() {
  var wide = innerWidth >= 900, s = 0;
  if (MODE === 'A') {
    var line = innerHeight * (wide ? .55 : .8);
    items.forEach(function (it) {
      var r = it.getBoundingClientRect();
      if (r.top < line) s = Math.max(s, +it.getAttribute('data-s'));
      if (!wide) it.classList.toggle('up', r.bottom < innerHeight * .7);
    });
    document.querySelectorAll('.chead,.story .end').forEach(function (h) { if (!wide) h.classList.toggle('up', h.getBoundingClientRect().bottom < innerHeight * .7); });
  } else {
    var rs = document.getElementById('rstory').getBoundingClientRect(), segs = document.querySelectorAll('.seg'), k = -1;
    var kk = null; segs.forEach(function (sg) { if (sg.getBoundingClientRect().top < innerHeight * .45) { kk = sg.getAttribute('data-k'); k = kk === 'end' ? TOTAL : +kk; } });
    var panelOn = rs.top < innerHeight * .5 && k >= 0;
    document.getElementById('rpanel').classList.toggle('hide', !panelOn);
    s = Math.max(0, k);
    if (panelOn) showCard(kk === 'end' ? 'end' : k);
  }
  setStage(s);
  document.getElementById('tocbtn').classList.toggle('hide', document.getElementById('toc').getBoundingClientRect().bottom > 0);
}
function setMode(m) {
  MODE = m; document.body.classList.toggle('vA', m === 'A'); document.body.classList.toggle('vB', m === 'B');
  document.querySelectorAll('#toc a').forEach(function (a) { a.setAttribute('href', '#' + (m === 'B' ? 'rch-' : 'ch-') + a.getAttribute('data-cid')); });
  shown = null; cur = -1; layoutTrail(); onScroll();
}
addEventListener('scroll', onScroll, {passive: true});
addEventListener('resize', function () { layoutTrail(); cur = -1; shown = null; onScroll(); });
document.getElementById('tocbtn').onclick = function () { scrollTo({top: 0, behavior: 'smooth'}); };
// Вариант подачи: A — «лента» (по умолчанию), B — «маршрут» (адрес bivuak/#marshrut).
// Чтобы сделать «маршрут» основным, поменяйте DEFAULT_MODE на 'B'.
var DEFAULT_MODE = 'A';
function modeFromHash() { return location.hash === '#marshrut' ? 'B' : location.hash === '#lenta' ? 'A' : DEFAULT_MODE; }
setMode(modeFromHash());
addEventListener('hashchange', function () { if (/^#(marshrut|lenta)$/.test(location.hash)) setMode(modeFromHash()); });
})();
</script>
