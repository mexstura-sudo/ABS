<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Узлы</title>
<meta name="theme-color" content="#F5EEDF">
<link href="../assets/fonts/manrope.css" rel="stylesheet">
<style>
:root{--green:#284F36;--orange:#D85B21;--navy:#1F3954;--sand:#E4D5C2;--cream:#F5EEDF;--paper:#FBF8F1;--muted:#5B6B7C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;color:inherit}
a{touch-action:manipulation}
html,body{margin:0;background:var(--cream);color:var(--navy);font-family:Gilroy,Manrope,system-ui,sans-serif;font-weight:400}
b,h1,h2,h3{font-weight:800}
a{color:var(--green)}
#app{max-width:680px;margin:0 auto;position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;padding-bottom:40px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.blob{position:absolute;pointer-events:none;z-index:0}
.hero{position:relative;z-index:1;padding:54px 20px 6px}
.kick{font-size:13px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:1.5px}
.hero h1{font-size:36px;line-height:1.05;margin:8px 0 0;max-width:78%;letter-spacing:-.4px}
.rope{display:block;width:100%;height:84px;margin:6px 0 0}
.rope path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.rope .r1{stroke:var(--orange);stroke-width:9;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s .2s cubic-bezier(.6,0,.2,1) forwards}
.rope .r2{stroke:var(--paper);stroke-width:2.5;stroke-dasharray:6 10;opacity:0;animation:fadeIn .6s 2.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:.9}}
.wrap{position:relative;z-index:1;padding:4px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border-radius:28px;padding:20px;box-shadow:0 10px 30px rgba(31,57,84,.10)}
.lead{font-size:17px;line-height:1.55;margin:0}
/* плеер шагов */
.player{padding:14px}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#fff;height:0;padding-top:75%;-webkit-mask-image:-webkit-radial-gradient(white,black)}
.stage img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;opacity:0;-webkit-transform:scale(.94);transform:scale(.94);transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.stage img.on{opacity:1;-webkit-transform:none;transform:none}
.stage .retry{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;border:0;background:#fff;color:var(--muted);font-family:inherit;font-weight:800;font-size:14px;z-index:3}
.stage .num{position:absolute;left:12px;top:12px;background:var(--navy);color:var(--cream);font-weight:800;border-radius:14px;padding:7px 12px;font-size:14px;z-index:2}
.segs{display:flex;gap:5px;margin:12px 2px 0}
.segs button{flex:1;height:8px;border-radius:8px;border:0;background:var(--sand);padding:0;cursor:pointer;position:relative;overflow:hidden}
.segs button i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green)}
.segs button.done i{width:100%}
.segs button.now i{animation:fill var(--dur) linear forwards}
.segs.paused button.now i{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.ctrl{display:flex;gap:10px;margin-top:12px;align-items:center}
.ctrl button{height:48px;border-radius:16px;border:0;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer}
.ctrl .round{width:48px;background:var(--cream);color:var(--navy);font-size:20px}
.ctrl .play{flex:1;background:var(--green);color:var(--cream)}
.cap{font-size:14px;color:var(--muted);text-align:center;margin-top:8px;min-height:18px}
/* плюсы, минусы, применение */
.pm{display:grid;grid-template-columns:1fr;gap:12px}
.pm .card{position:relative;padding-left:66px}
.pm .ic{position:absolute;left:18px;top:18px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff}
.plus .ic{background:var(--green)}.minus .ic{background:var(--orange)}.use .ic{background:var(--navy)}
.pm h3{margin:4px 0 6px;font-size:18px}
.pm p{margin:0;line-height:1.55;font-size:16px}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.reveal.seen{opacity:1;transform:none}
.nav{display:flex;gap:10px}
.nav a{flex:1;text-decoration:none;background:var(--paper);border-radius:20px;padding:14px 16px;color:var(--navy);box-shadow:0 4px 14px rgba(31,57,84,.08);display:flex;flex-direction:column;gap:2px}
.nav a small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:800}
.nav a b{font-size:16px}
.nav a.next{text-align:right}
/* список */
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--paper);border-radius:24px;padding:12px;text-decoration:none;color:var(--navy);box-shadow:0 6px 18px rgba(31,57,84,.08);display:flex;flex-direction:column;gap:8px;transition:transform .2s}
.item:active{transform:scale(.97)}
.item img{display:block;width:100%;height:auto;object-fit:contain;background:#fff;border-radius:16px}
.item .n{font-size:12px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:1px}
.item b{font-size:16px;line-height:1.2}
.btn{display:block;text-align:center;border:0;border-radius:20px;padding:17px;font-family:inherit;font-size:17px;font-weight:800;background:var(--navy);color:var(--cream);text-decoration:none;cursor:pointer;width:100%}
.in{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}.rope .r1{stroke-dashoffset:0}}
@media(max-width:380px){.hero h1{font-size:30px}.list{grid-template-columns:1fr}}
/* печать QR */
.qrsheet{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}#app{display:none}
  .qrsheet{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
  .qrcard{border:1.5mm solid #284F36;border-radius:8mm;padding:6mm;text-align:center;break-inside:avoid;height:85mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm}
  .qrcard img{width:52mm;height:52mm}
  .qrcard b{font-size:16pt;color:#1F3954}
  .qrcard span{font-size:10pt;color:#284F36;font-weight:800;text-transform:uppercase;letter-spacing:1px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="qrsheet" id="qrsheet"></div>
<script>
/* QR-код без библиотек: байтовый режим, уровень коррекции M, версии 1–6 (до 106 байт).
   Перенос liga/qr.py на JavaScript. qrSvg(text) → строка <svg>, qrDataUrl(text) → картинка для <img>. */
var QR = (function () {
  var BLOCKS = {1: [10, [[1, 16]]], 2: [16, [[1, 28]]], 3: [26, [[1, 44]]], 4: [18, [[2, 32]]], 5: [24, [[2, 43]]], 6: [16, [[4, 27]]]};
  var ALIGN = {1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34]};
  var EXP = new Array(512), LOG = new Array(256), x = 1, i;
  for (i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
  for (i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  function gmul(a, b) { return a === 0 || b === 0 ? 0 : EXP[LOG[a] + LOG[b]]; }
  function rsGen(n) {
    var g = [1];
    for (var i = 0; i < n; i++) {
      var g2 = new Array(g.length + 1).fill(0);
      for (var j = 0; j < g.length; j++) { g2[j] ^= g[j]; g2[j + 1] ^= gmul(g[j], EXP[i]); }
      g = g2;
    }
    return g;
  }
  function rsRem(data, n) {
    var gen = rsGen(n), rem = data.concat(new Array(n).fill(0));
    for (var i = 0; i < data.length; i++) { var c = rem[i]; if (c) for (var j = 1; j < gen.length; j++) rem[i + j] ^= gmul(gen[j], c); }
    return rem.slice(data.length);
  }
  function bin(v, len) { var s = v.toString(2); while (s.length < len) s = '0' + s; return s; }
  function utf8(text) { var out = [], s = unescape(encodeURIComponent(text)); for (var i = 0; i < s.length; i++) out.push(s.charCodeAt(i)); return out; }
  function codewords(data, version) {
    var ecN = BLOCKS[version][0], groups = BLOCKS[version][1], cap = 0, i;
    groups.forEach(function (g) { cap += g[0] * g[1]; });
    var bits = '0100' + bin(data.length, 8) + data.map(function (b) { return bin(b, 8); }).join('');
    bits += '0'.repeat(Math.min(4, cap * 8 - bits.length));
    bits += '0'.repeat((8 - bits.length % 8) % 8);
    var cw = [];
    for (i = 0; i < bits.length; i += 8) cw.push(parseInt(bits.slice(i, i + 8), 2));
    var pad = [0xEC, 0x11], base = bits.length / 8;
    while (cw.length < cap) cw.push(pad[(cw.length - base) % 2]);
    var blocks = [], pos = 0;
    groups.forEach(function (g) { for (var n = 0; n < g[0]; n++) { blocks.push(cw.slice(pos, pos + g[1])); pos += g[1]; } });
    var ecc = blocks.map(function (b) { return rsRem(b, ecN); }), out = [], mx = 0;
    blocks.forEach(function (b) { mx = Math.max(mx, b.length); });
    for (i = 0; i < mx; i++) blocks.forEach(function (b) { if (i < b.length) out.push(b[i]); });
    for (i = 0; i < ecN; i++) ecc.forEach(function (e) { out.push(e[i]); });
    return out;
  }
  function formatBits(mask) {
    var data = mask, rem = data << 10;
    for (var i = 14; i > 9; i--) if (rem & (1 << i)) rem ^= 0x537 << (i - 10);
    return ((data << 10) | rem) ^ 0x5412;
  }
  function maskFn(mask, r, c) {
    switch (mask) {
      case 0: return (r + c) % 2 === 0;
      case 1: return r % 2 === 0;
      case 2: return c % 3 === 0;
      case 3: return (r + c) % 3 === 0;
      case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
      case 5: return (r * c) % 2 + (r * c) % 3 === 0;
      case 6: return ((r * c) % 2 + (r * c) % 3) % 2 === 0;
      default: return ((r + c) % 2 + (r * c) % 3) % 2 === 0;
    }
  }
  function build(version, cw, mask) {
    var size = 17 + 4 * version, m = [], r, c, i;
    for (r = 0; r < size; r++) m.push(new Array(size).fill(null));
    function finder(r0, c0) {
      for (var dr = -1; dr < 8; dr++) for (var dc = -1; dc < 8; dc++) {
        var rr = r0 + dr, cc = c0 + dc;
        if (rr >= 0 && rr < size && cc >= 0 && cc < size) {
          var inside = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6;
          var ring = inside && (dr === 0 || dr === 6 || dc === 0 || dc === 6);
          var core = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
          m[rr][cc] = ring || core ? 1 : 0;
        }
      }
    }
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
    for (i = 8; i < size - 8; i++) m[6][i] = m[i][6] = i % 2 === 0 ? 1 : 0;
    var pos = ALIGN[version];
    pos.forEach(function (ar) { pos.forEach(function (ac) {
      if (m[ar][ac] !== null) return;
      for (var dr = -2; dr < 3; dr++) for (var dc = -2; dc < 3; dc++) m[ar + dr][ac + dc] = Math.max(Math.abs(dr), Math.abs(dc)) !== 1 ? 1 : 0;
    }); });
    m[size - 8][8] = 1;
    var res = m.map(function (row) { return row.map(function (v) { return v !== null; }); });
    for (i = 0; i < 9; i++) res[8][i] = res[i][8] = true;
    for (i = 0; i < 8; i++) res[8][size - 1 - i] = res[size - 1 - i][8] = true;
    var bits = cw.map(function (b) { return bin(b, 8); }).join(''), k = 0, up = true, col = size - 1;
    while (col > 0) {
      if (col === 6) col -= 1;
      for (var t = 0; t < size; t++) {
        r = up ? size - 1 - t : t;
        for (var j = 0; j < 2; j++) {
          c = col - j;
          if (res[r][c]) continue;
          var bit = k < bits.length ? +bits[k] : 0; k++;
          if (maskFn(mask, r, c)) bit ^= 1;
          m[r][c] = bit;
        }
      }
      up = !up; col -= 2;
    }
    var fb = formatBits(mask), f = [];
    for (i = 0; i < 15; i++) f.push((fb >> i) & 1);
    for (i = 0; i < 6; i++) m[i][8] = f[i];
    m[7][8] = f[6]; m[8][8] = f[7]; m[8][7] = f[8];
    for (i = 9; i < 15; i++) m[8][14 - i] = f[i];
    for (i = 0; i < 8; i++) m[8][size - 1 - i] = f[i];
    for (i = 8; i < 15; i++) m[size - 15 + i][8] = f[i];
    m[size - 8][8] = 1;
    return m;
  }
  function penalty(m) {
    var size = m.length, p = 0, lines = m.slice(), r, c;
    for (c = 0; c < size; c++) lines.push(m.map(function (row) { return row[c]; }));
    lines.forEach(function (line) {
      var run = 1;
      for (var i = 1; i < size; i++) { if (line[i] === line[i - 1]) run++; else { if (run >= 5) p += run - 2; run = 1; } }
      if (run >= 5) p += run - 2;
      var s = line.join(''), a = s.split('10111010000').length - 1, b = s.split('00001011101').length - 1;
      p += 40 * (a + b);
    });
    for (r = 0; r < size - 1; r++) for (c = 0; c < size - 1; c++) if (m[r][c] === m[r][c + 1] && m[r][c] === m[r + 1][c] && m[r][c] === m[r + 1][c + 1]) p += 3;
    var dark = 0; m.forEach(function (row) { row.forEach(function (v) { dark += v; }); });
    dark = Math.floor(dark * 100 / (size * size));
    p += Math.floor(Math.abs(dark - 50) / 5) * 10;
    return p;
  }
  function matrix(text) {
    var data = utf8(text), version = 0;
    for (var v = 1; v <= 6; v++) { var cap = 0; BLOCKS[v][1].forEach(function (g) { cap += g[0] * g[1]; }); if (data.length <= cap - 2) { version = v; break; } }
    if (!version) throw new Error('Слишком длинная ссылка для QR');
    var cw = codewords(data, version), best = null, bestP = Infinity;
    for (var mk = 0; mk < 8; mk++) { var m = build(version, cw, mk), p = penalty(m); if (p < bestP) { best = m; bestP = p; } }
    return best;
  }
  function svg(text, color) {
    var m = matrix(text), q = 4, n = m.length + 2 * q, d = '';
    m.forEach(function (row, r) { row.forEach(function (v, c) { if (v) d += 'M' + (c + q) + ' ' + (r + q) + 'h1v1h-1z'; }); });
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" width="' + n * 4 + '" height="' + n * 4 + '" shape-rendering="crispEdges">' +
      '<rect width="' + n + '" height="' + n + '" fill="#fff"/><path d="' + d + '" fill="' + (color || '#111418') + '"/></svg>';
  }
  return {matrix: matrix, svg: svg, dataUrl: function (text) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg(text)); }};
})();
if (typeof module !== 'undefined') module.exports = QR;

</script>
<script>
var KNOTS = [
  {slug: 'pryamoy', title: 'Прямой (рифовый) узел', img: 'reef', steps: 4, caps: ['1-й способ, шаг 1', '1-й способ, готово', '2-й способ, шаг 1', '2-й способ, готово'],
   lead: 'Самый первый узел, которому учат скаутов. Два конца верёвок одинаковой толщины: обвязать концы друг вокруг друга дважды и вывести параллельно. Завязывать концы — например, при перевязке узелков в «верёвочной змейке» или связывании шнуров. Важно: без контрольных узлов может ползти, на мокрой верёвке затягивается туго. Правило: первое скрещивание «лево на право», второе — «право на лево», иначе получится ненадёжный «бабий» вариант.',
   plus: 'Вяжется мгновенно, плоский — не мешает под верёвочным «тромбоном» груза.',
   minus: 'Под рывком может «переворачиваться» в два полуштыка и развязаться; на мокрых и жёстких верёвках ползёт и затягивается намертво — без контрольных узлов недопустим.',
   use: 'Связывание шнуров одинаковой толщины; завязывание «тромбона» — связки скатанного коврика и рюкзака; перевязка мешков и свёртков; фиксация бинта или жгута (как в медицине); быстрая починка порванной бечёвки в лагере.'},
  {slug: 'vosmerka-provodnik', title: 'Восьмёрка-проводник', img: 'eight', steps: 4,
   lead: 'Самый первый узел, которому учат скаутов. Вяжется так: конец верёвки обводят вокруг коренной части и продевают в получившуюся петлю, повторяя форму восьмёрки. Базовый стопорный узел и основа многих других.',
   plus: 'Вяжется за секунду, не затягивается намертво, сам не развязывается, работает на любой верёвке.',
   minus: 'Лишь немного утолщает верёвку — как стопор на скользкой опоре может поползти.',
   use: 'Узел формирует петлю, которую в альпинизме, например, используют для ввязывания в неё другой верёвки (создание бекетового узла) или подвеса; стопор на конце верёвки, чтобы она не выскользнула из петли или отверстия; утолщение конца для держателя; элемент декоративных и фиксирующих вязок; простая ручка-ограничитель на шнуре палатки.'},
  {slug: 'bulin', title: 'Булинь', img: 'bowline', steps: 4,
   lead: 'Королевский узел: делает незатягивающуюся петлю на конце верёвки. Вяжется одной рукой, не ползёт под нагрузкой, легко развязывается после любого веса. Незатягивающаяся петля на конце верёвки: ходовой конец делает ход вокруг коренного и возвращается в начальную петлю. Не случайно называется «королём узлов».',
   plus: 'Не затягивается под любой нагрузкой, легко вяжется даже одной рукой, всегда можно развязать; петля не сжимает груз.',
   minus: 'На гладкой скользкой верёвке ползёт — нужен контрольный узел; легко ошибиться, если ходовой конец вышел «не туда» (вязать надо в определённом направлении).',
   use: 'Спасательная петля под грудь и подмышки; обвязка и опора вокруг дерева, столба, кольца; крепление перил переправы к камню или бревну; швырковая петля — если надо набросить верёвку на опору снизу; петля под рюкзак, канистру, банку для вытягивания; «удавка наоборот» для бочек и габаритных грузов.'},
  {slug: 'avstriyskiy-provodnik', title: 'Австрийский проводник', img: 'austrian', steps: 4,
   lead: 'На сложенной вдвое верёвке делают оборот и продевают петлю в получившееся «окно», расправляют узел — получается незатягивающаяся петля в середине верёвки, а не на конце. Именно это отличает его от обычного проводника: нагрузка идёт в обе стороны вдоль верёвки, а узел не деформируется и не затягивается.',
   plus: 'Единственный по-настоящему надёжный способ получить петлю в середине верёвки — держит даже при рывках в обе стороны; почти не ослабляет верёвку; легко развязывается после нагрузки.',
   minus: 'Требует тренировки — в спешке легко завязать «не ту» петлю или перекрутить верёвку; занимает больше длины, чем простой узел.',
   use: 'Ступени для подъёма по верёвке (петли для ног — «лестница» из австрийских проводников); точка крепления в середине верёвки — закрепить карабин на перилах или навесной переправе, не имея свободного конца; изоляция повреждённого участка — перетёртый кусок верёвки оставляют без нагрузки, завязав петли по обе стороны; переноска грузов — петли под жерди для переноски брёвен или носилок; аварийная «ручка» на перилах, за которую можно держаться.'},
  {slug: 'greypvayn', title: 'Грейпвайн (двойной рыбацкий)', img: 'grapevine', steps: 7,
   lead: 'Два конца поочерёдно обвивают друг друга вокруг коренной части, затем продеваются в петли. Отлично соединяет две верёвки одинакового диаметра — в том числе тонкие репшнуры и «слёзы» для петель. Один из самых надёжных узлов для связывания, но почти не развязывается после серьёзной нагрузки — обычно режут.',
   plus: 'Один из самых надёжных для связывания; хорошо держит и на тонких репшнурах; не требует контрольных узлов.',
   minus: 'Почти не развязывается после серьёзной нагрузки — обычно узел срезают; требует внимательности и расправления, в спешке легко связать «кривой» грейпвайн.',
   use: 'Связывание основной верёвки с репшнуром при организации спуска; сращивание перетёртой верёвки — вырезают «битый» участок и связывают концы; изготовление петель-самозатягиваний и сменных петель для страховки; связывание верёвок одинакового диаметра на переправах и в перилах.'}
];
var BLOBS = '<svg class="blob" aria-hidden="true" viewBox="0 0 200 160" style="right:-40px;top:-30px;width:210px;height:170px"><path d="M40 0h160v150c-30 10-55-10-62-40-8-34-40-30-70-46C40 50 20 20 40 0z" fill="#284F36"/><path d="M110 0h90v40c-25 12-55 0-70-14-8-8-15-16-20-26z" fill="#D85B21"/></svg>' +
  '<svg class="blob" aria-hidden="true" viewBox="0 0 200 200" style="left:-70px;bottom:-60px;width:200px;height:200px"><path d="M0 30c50-10 95 20 110 70 12 40 40 70 90 100H0z" fill="#1F3954"/></svg>';
// декоративная верёвка, которая «завязывается» при открытии страницы
var ROPE = '<svg class="rope" viewBox="0 0 640 84" preserveAspectRatio="none" aria-hidden="true">' +
  '<path class="r1" d="M8 60 C110 60 170 58 230 50 C300 40 300 6 262 8 C222 10 236 70 300 66 C360 62 352 20 320 24 C290 28 312 58 380 56 C470 54 540 58 632 56"/>' +
  '<path class="r2" d="M8 60 C110 60 170 58 230 50 C300 40 300 6 262 8 C222 10 236 70 300 66 C360 62 352 20 320 24 C290 28 312 58 380 56 C470 54 540 58 632 56"/></svg>';
var STEP_MS = 2600;
var P = {i: 0, playing: true, t: null, k: null};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function slug() { return (location.hash.match(/^#([\w-]+)/) || [])[1] || ''; }
var BASE = location.href.split('#')[0].split('?')[0];

function renderList() {
  document.title = 'Узлы';
  document.getElementById('app').innerHTML = BLOBS + '<div class="hero"><div class="kick">Туристические узлы</div><h1>Узлы на столе</h1>' + ROPE + '</div>' +
    '<div class="wrap"><p class="lead in" style="padding:0 4px">Наведите камеру телефона на QR-код у узла — откроется его страница со схемой вязания. Или выберите узел здесь.</p>' +
    '<div class="list">' + KNOTS.map(function (k, i) {
      return '<a class="item in" style="animation-delay:' + (150 + i * 70) + 'ms" href="#' + k.slug + '"><img src="img/' + k.img + '-' + k.steps + '.jpg" alt="" onerror="imgRetry(this)"><span class="n">Узел ' + (i + 1) + '</span><b>' + esc(k.title) + '</b></a>';
    }).join('') + '</div>' + (/[?&]print/.test(location.search) ? '<button class="btn in" style="animation-delay:600ms" onclick="printQR()">Напечатать QR-коды (A4)</button>' : '') + '</div>';
}
function printQR() {
  document.getElementById('qrsheet').innerHTML = KNOTS.map(function (k, i) {
    return '<div class="qrcard"><span>Узел ' + (i + 1) + '</span><b>' + esc(k.title) + '</b><img src="' + QR.dataUrl(BASE + '#' + k.slug) + '" alt=""><span>Наведи камеру</span></div>';
  }).join('');
  var imgs = document.querySelectorAll('#qrsheet img'), left = imgs.length;
  imgs.forEach(function (im) { im.onload = im.onerror = function () { if (--left === 0) window.print(); }; });
}

// плохая связь: картинка не пришла — пробуем ещё раз через секунду, потом кнопкой
function imgRetry(im) {
  var n = +(im.getAttribute('data-try') || 0), src = im.getAttribute('src').split('?')[0];
  if (n < 3) { im.setAttribute('data-try', n + 1); setTimeout(function () { im.src = src + '?r=' + Date.now(); }, 900 * (n + 1)); return; }
  var stage = im.closest && im.closest('.stage');
  if (stage && !stage.querySelector('.retry')) {
    var b = document.createElement('button'); b.className = 'retry'; b.textContent = '🖼 Картинка не загрузилась — нажмите';
    b.onclick = function () { b.remove(); stage.querySelectorAll('img').forEach(function (x) { x.setAttribute('data-try', 0); x.src = x.getAttribute('src').split('?')[0] + '?r=' + Date.now(); }); };
    stage.appendChild(b);
  }
}
function renderKnot(k) {
  var idx = KNOTS.indexOf(k), prev = KNOTS[(idx + KNOTS.length - 1) % KNOTS.length], next = KNOTS[(idx + 1) % KNOTS.length];
  document.title = k.title + ' — узел';
  var imgs = '', segs = '';
  for (var n = 1; n <= k.steps; n++) {
    imgs += '<img src="img/' + k.img + '-' + n + '.jpg" alt="Шаг ' + n + '"' + (n === 1 ? ' class="on"' : '') + ' onerror="imgRetry(this)">';
    segs += '<button aria-label="Шаг ' + n + '" onclick="goStep(' + (n - 1) + ', true)"><i></i></button>';
  }
  document.getElementById('app').innerHTML = BLOBS + '<div class="hero"><div class="kick">Узел ' + (idx + 1) + ' из ' + KNOTS.length + '</div><h1>' + esc(k.title) + '</h1>' + ROPE + '</div>' +
    '<div class="wrap">' +
      '<div class="card player in" style="animation-delay:200ms"><div class="stage" id="stage"><span class="num" id="num">Шаг 1 из ' + k.steps + '</span>' + imgs + '</div>' +
        '<div class="segs" id="segs" style="--dur:' + STEP_MS + 'ms">' + segs + '</div>' +
        '<div class="cap" id="cap"></div>' +
        '<div class="ctrl"><button class="round" aria-label="Предыдущий шаг" onclick="goStep(P.i - 1, true)">‹</button>' +
        '<button class="play" id="play" onclick="togglePlay()">Пауза</button>' +
        '<button class="round" aria-label="Следующий шаг" onclick="goStep(P.i + 1, true)">›</button></div></div>' +
      '<div class="card in" style="animation-delay:450ms"><p class="lead">' + esc(k.lead) + '</p></div>' +
      '<div class="pm">' +
        '<div class="card plus reveal"><span class="ic">+</span><h3>Плюсы</h3><p>' + esc(k.plus) + '</p></div>' +
        '<div class="card minus reveal"><span class="ic">−</span><h3>Минусы</h3><p>' + esc(k.minus) + '</p></div>' +
        '<div class="card use reveal"><span class="ic">✓</span><h3>Применение</h3><p>' + esc(k.use) + '</p></div></div>' +
      '<div class="nav reveal"><a href="#' + prev.slug + '"><small>← Предыдущий</small><b>' + esc(prev.title) + '</b></a>' +
        '<a class="next" href="#' + next.slug + '"><small>Следующий →</small><b>' + esc(next.title) + '</b></a></div>' +
      '<a class="btn reveal" href="#">Все узлы</a></div>';
  P.k = k; P.i = 0; P.playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  goStep(0); reveal();
}
function goStep(i, manual) {
  var k = P.k, n = k.steps; i = (i + n) % n; P.i = i;
  document.querySelectorAll('#stage img').forEach(function (im, j) { im.classList.toggle('on', j === i); });
  document.querySelectorAll('#segs button').forEach(function (b, j) {
    b.classList.remove('now'); b.classList.toggle('done', j < i);
    if (j === i) { void b.offsetWidth; b.classList.add(P.playing ? 'now' : 'done'); }
  });
  document.getElementById('num').textContent = 'Шаг ' + (i + 1) + ' из ' + n;
  document.getElementById('cap').textContent = k.caps ? k.caps[i] : (i === n - 1 ? 'Готово! Затяните узел и расправьте его' : '');
  if (manual && P.playing) togglePlay();
  schedule();
}
function schedule() {
  clearTimeout(P.t);
  if (P.playing) P.t = setTimeout(function () { goStep(P.i + 1); }, P.i === P.k.steps - 1 ? STEP_MS + 1200 : STEP_MS);
}
function togglePlay() {
  P.playing = !P.playing;
  document.getElementById('play').textContent = P.playing ? 'Пауза' : 'Смотреть по шагам';
  var cur = document.querySelectorAll('#segs button')[P.i];
  if (cur) { cur.classList.remove('now', 'done'); void cur.offsetWidth; cur.classList.add(P.playing ? 'now' : 'done'); }
  schedule();
}
function reveal() {
  var els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) return els.forEach(function (e) { e.classList.add('seen'); });
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }); }, {threshold: .15});
  els.forEach(function (e, i) { e.style.transitionDelay = (i % 3) * 90 + 'ms'; io.observe(e); });
}

document.addEventListener('visibilitychange', function () { if (P.k && !document.hidden && P.playing) schedule(); else clearTimeout(P.t); });
window.addEventListener('pageshow', function (e) { if (e.persisted && P.k) goStep(P.i); });   // Safari вернул страницу из кэша «Назад»
function route() {
  clearTimeout(P.t); P.k = null;
  var k = KNOTS.filter(function (x) { return x.slug === slug(); })[0];
  if (k) renderKnot(k); else renderList();
}
window.addEventListener('hashchange', function () { route(); window.scrollTo(0, 0); });
route();
</script>
<script>
/* iPhone: Safari иногда «съедает» нажатие, если в этот момент на странице что-то меняется (анимация, таймер).
   Короткое касание кнопки обрабатываем сами, повторное «родное» нажатие гасим. */
(function () {
  var t0 = null, fastAt = 0, fastX = 0, fastY = 0;
  document.addEventListener('touchstart', function (e) { var p = e.touches[0]; t0 = e.touches.length === 1 ? {x: p.clientX, y: p.clientY, at: Date.now()} : null; }, {passive: true});
  document.addEventListener('touchmove', function (e) { if (!t0) return; var p = e.touches[0]; if (Math.abs(p.clientX - t0.x) > 10 || Math.abs(p.clientY - t0.y) > 10) t0 = null; }, {passive: true});
  document.addEventListener('touchend', function (e) {
    var s = t0; t0 = null;
    if (!s || Date.now() - s.at > 800) return;
    var b = e.target.closest && e.target.closest('button');
    if (!b || b.disabled) return;
    e.preventDefault(); var ct = e.changedTouches && e.changedTouches[0]; fastX = ct ? ct.clientX : 0; fastY = ct ? ct.clientY : 0; fastAt = Date.now(); b.click();
  }, {passive: false});
  document.addEventListener('click', function (e) { if (e.isTrusted && Date.now() - fastAt < 600 && Math.abs(e.clientX - fastX) < 20 && Math.abs(e.clientY - fastY) < 20) { e.stopPropagation(); e.preventDefault(); } }, true);
})();
</script>
